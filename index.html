          }}
        >
          <div
            style={{
              height:3,
              borderRadius:999,
              background:color || COLORS.primary,
              marginBottom:6,
              opacity: active ? 1 : 0.6
            }}
          />
          <div
            style={{
              fontSize:11,
              color:COLORS.subtext,
              textTransform:"uppercase",
              letterSpacing:".03em",
              marginBottom:6,
              textAlign:"left"
            }}
          >
            {label}
          </div>
          <div style={{fontSize:18, fontWeight:800, textAlign:"left"}}>{value}</div>
          {sub && (
            <div
              style={{
                fontSize:12,
                color:COLORS.subtext,
                marginTop:4,
                textAlign:"left"
              }}
            >
              {sub}
            </div>
          )}
        </button>
      );
    }

    function MetricDetail({ metric, delivered }) {
      let title = metric;
      let body = "";
      if (metric === "Delivered") {
        body = `Estimated number of emails or SMS successfully delivered based on your selected audience of ${delivered.toLocaleString()} contacts.`;
      } else if (metric === "Open Rate") {
        body = "Percentage of delivered messages that were opened at least once. Use this to see if your subject lines and timing are working.";
      } else if (metric === "Click Rate") {
        body = "Percentage of delivered messages that received at least one click. This helps you understand if your content and calls-to-action are compelling.";
      } else if (metric === "Unsubscribe") {
        body = "Percentage of recipients who unsubscribed from your messages. A spike here can indicate messaging fatigue or misaligned expectations.";
      } else if (metric === "Spam") {
        body = "Percentage of recipients who marked your emails as spam. Keep this number low to protect deliverability and trust.";
      }

      return (
        <div
          style={{
            marginTop:8,
            border:`1px dashed ${COLORS.border}`,
            borderRadius:10,
            padding:"8px 10px",
            background:COLORS.panelAlt,
            textAlign:"left"
          }}
        >
          <div
            style={{
              fontSize:12,
              fontWeight:600,
              marginBottom:4,
              textAlign:"left"
            }}
          >
            {title} details
          </div>
          <div
            style={{
              fontSize:12,
              color:COLORS.subtext,
              textAlign:"left"
            }}
          >
            {body}
          </div>
        </div>
      );
    }

    function AnalyticsRow({ audienceCount, selectedMetric, onSelectMetric }) {
      const delivered = audienceCount;
      const openRate = 0.36;
      const clickRate = 0.042;
      const unsubRate = 0.002;
      const spamRate = 0.0002;

      return (
        <>
          <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
            <MetricCard
              label="Delivered"
              value={delivered.toLocaleString()}
              active={selectedMetric==="Delivered"}
              color={BRAND.mint}
              onClick={()=>onSelectMetric("Delivered")}
            />
            <MetricCard
              label="Open Rate"
              value={(openRate*100).toFixed(1) + "%"}
              sub="vs. last 30 days: +2.1%"
              active={selectedMetric==="Open Rate"}
              color={BRAND.blue}
              onClick={()=>onSelectMetric("Open Rate")}
            />
            <MetricCard
              label="Click Rate"
              value={(clickRate*100).toFixed(1) + "%"}
              sub="vs. last 30 days: -0.3%"
              active={selectedMetric==="Click Rate"}
              color={BRAND.purple}
              onClick={()=>onSelectMetric("Click Rate")}
            />
            <MetricCard
              label="Unsubscribe"
              value={(unsubRate*100).toFixed(2) + "%"}
              active={selectedMetric==="Unsubscribe"}
              color={BRAND.yellow}
              onClick={()=>onSelectMetric("Unsubscribe")}
            />
            <MetricCard
              label="Spam"
              value={(spamRate*100).toFixed(2) + "%"}
              active={selectedMetric==="Spam"}
              color={BRAND.red}
              onClick={()=>onSelectMetric("Spam")}
            />
          </div>
          <MetricDetail
            metric={selectedMetric}
            delivered={delivered}
          />
        </>
      );
    }
    function AudienceSelectorInline({ onClose, onApply, initialSelected=[] }){
      const [source, setSource] = useState("roster");
      const [selected, setSelected] = useState(initialSelected);
      const [manual, setManual] = useState("");
      const [rosterFilter, setRosterFilter] = useState("All Roster");
      const [detailSegment, setDetailSegment] = useState(null);
      const [detailSearch, setDetailSearch] = useState("");

      const sourceOptions = [
        { id:"roster", label:"Use BeAKid Roster" },
        { id:"excel", label:"Upload From Excel" },
        { id:"sheets", label:"Upload From Google Sheets" },
        { id:"manual", label:"Upload Manually" },
      ];

      const addSegment = (seg)=> setSelected(p=> p.includes(seg)? p : [...p, seg]);
      const removeSegment = (seg)=> setSelected(p=> p.filter(s=>s!==seg));

      const parseManual = ()=>{
        const raw = manual
          .replace(/\s+/g," ")
          .replace(/[\n;]/g,",")
          .split(",")
          .map(s=>s.trim())
          .filter(Boolean);
        const emails = Array.from(new Set(raw));
        const valid = emails.filter(e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e));
        const invalid = emails.filter(e=>!valid.includes(e));
        alert(`Parsed ${emails.length} entries.\nValid: ${valid.length}\nInvalid dropped: ${invalid.length}`);
        if (valid.length) addSegment(`Manual List (${valid.length})`);
      };

      const segmentsDemo = [
        "All Contacts",
        "Class A",
        "Class A / Session A1",
        "Class A / Session A2",
        "Class B",
        "Class C / Session C1"
      ];

      // Simple mock data to illustrate “view details”
      const MOCK_CONTACTS = [
        { name:"Alex Rivera", relation:"Parent", email:"alex@example.com" },
        { name:"Jamie Chen", relation:"Parent", email:"jamie@example.com" },
        { name:"Taylor Singh", relation:"Guardian", email:"taylor@example.com" },
        { name:"Jordan Lee", relation:"Parent", email:"jordan@example.com" },
      ];

      const filteredContacts = MOCK_CONTACTS.filter(c=>{
        if (!detailSearch.trim()) return true;
        const q = detailSearch.toLowerCase();
        return (
          c.name.toLowerCase().includes(q) ||
          c.relation.toLowerCase().includes(q) ||
          c.email.toLowerCase().includes(q)
        );
      });

      return (
        <div
          id="audience-selector"
          style={{
            marginTop:10,
            border:`1px solid ${COLORS.border}`,
            borderRadius:10,
            padding:10,
            background:COLORS.panelAlt,
            textAlign:"left"
          }}
        >
          <div
            style={{
              display:"flex",
              justifyContent:"space-between",
              alignItems:"center",
              marginBottom:8
            }}
          >
            <h3 style={{margin:0, fontSize:14, textAlign:"left"}}>
              Choose audience source
            </h3>
            <button style={btnGhost} onClick={onClose} aria-label="Close audience selection">
              ✕
            </button>
          </div>

          <div style={{marginBottom:8}}>
            <label
              style={{
                display:"block",
                fontSize:12,
                color:COLORS.subtext,
                marginBottom:4,
                textAlign:"left"
              }}
            >
              Source
            </label>
            <select
              value={source}
              onChange={e=>setSource(e.target.value)}
              style={inputStyle}
            >
              {sourceOptions.map(opt=>(
                <option key={opt.id} value={opt.id}>{opt.label}</option>
              ))}
            </select>
          </div>

          {source==="roster" && (
            <div style={{marginTop:8}}>
              <div
                style={{
                  fontSize:12,
                  color:COLORS.subtext,
                  marginBottom:4,
                  textAlign:"left"
                }}
              >
                Filter roster and add segments:
              </div>
              <div style={{marginBottom:6}}>
                <select
                  value={rosterFilter}
                  onChange={e=>setRosterFilter(e.target.value)}
                  style={inputStyle}
                >
                  <option>All Roster</option>
                  <option>Enrolled Families</option>
                  <option>Waitlist</option>
                  <option>Summer-Only</option>
                </select>
              </div>
              <div style={{display:"grid", gap:6}}>
                {segmentsDemo.map(s=>(
                  <div
                    key={s}
                    style={{
                      display:"flex",
                      gap:6,
                      alignItems:"center"
                    }}
                  >
                    <button
                      onClick={()=>addSegment(s)}
                      style={{
                        ...btnGhost,
                        justifyContent:"space-between",
                        flex:1,
                        padding:"8px 9px",
                        background:COLORS.panel,
                        fontSize:13,
                        cursor:"pointer"
                      }}
                      onMouseEnter={(e)=>{ e.currentTarget.style.backgroundColor = COLORS.optionHoverBg; }}
                      onMouseLeave={(e)=>{ e.currentTarget.style.backgroundColor = COLORS.panel; }}
                    >
                      <span>{s}</span>
                      <span style={{color:COLORS.subtext}}>Add</span>
                    </button>
                    <button
                      type="button"
                      style={{
                        ...btnGhost,
                        padding:"4px 6px",
                        fontSize:11
                      }}
                      onClick={()=>setDetailSegment(s)}
                    >
                      View
                    </button>
                  </div>
                ))}
              </div>

              {detailSegment && (
                <div
                  style={{
                    marginTop:10,
                    border:`1px solid ${COLORS.border}`,
                    borderRadius:10,
                    padding:8,
                    background:COLORS.panel
                  }}
                >
                  <div
                    style={{
                      display:"flex",
                      justifyContent:"space-between",
                      alignItems:"center",
                      marginBottom:6
                    }}
                  >
                    <div
                      style={{
                        fontSize:12,
                        fontWeight:600,
                        textAlign:"left"
                      }}
                    >
                      {detailSegment} — sample contacts
                    </div>
                    <button
                      style={{...btnGhost, padding:"2px 6px", fontSize:11}}
                      onClick={()=>{
                        setDetailSegment(null);
                        setDetailSearch("");
                      }}
                    >
                      Close
                    </button>
                  </div>
                  <div style={{marginBottom:6}}>
                    <input
                      type="text"
                      placeholder="Search by name, relation, email…"
                      value={detailSearch}
                      onChange={e=>setDetailSearch(e.target.value)}
                      style={{...inputStyle, fontSize:12}}
                    />
                  </div>
                  <div
                    style={{
                      maxHeight:160,
                      overflow:"auto",
                      borderRadius:8,
                      border:`1px solid ${COLORS.border}`
                    }}
                  >
                    <table
                      style={{
                        width:"100%",
                        borderCollapse:"collapse",
                        fontSize:12
                      }}
                    >
                      <thead>
                        <tr style={{background:COLORS.panelAlt}}>
                          <th style={{padding:"6px 8px", textAlign:"left"}}>
                            <input type="checkbox" aria-label="Select all (demo only)" />
                          </th>
                          <th style={{padding:"6px 8px", textAlign:"left"}}>Name</th>
                          <th style={{padding:"6px 8px", textAlign:"left"}}>Relation</th>
                          <th style={{padding:"6px 8px", textAlign:"left"}}>Email</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredContacts.map(c=>(
                          <tr key={c.email}>
                            <td style={{padding:"4px 8px"}}>
                              <input type="checkbox" />
                            </td>
                            <td style={{padding:"4px 8px"}}>{c.name}</td>
                            <td style={{padding:"4px 8px"}}>{c.relation}</td>
                            <td style={{padding:"4px 8px"}}>{c.email}</td>
                          </tr>
                        ))}
                        {filteredContacts.length===0 && (
                          <tr>
                            <td
                              colSpan={4}
                              style={{
                                padding:"6px 8px",
                                color:COLORS.subtext,
                                fontStyle:"italic",
                                textAlign:"left"
                              }}
                            >
                              No matches for this search (demo data).
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                  <div
                    style={{
                      marginTop:6,
                      fontSize:11,
                      color:COLORS.subtext,
                      textAlign:"left"
                    }}
                  >
                    Prototype note: checkboxes are for show only. In a live product you’d be able to fine-tune exactly who’s included.
                  </div>
                </div>
              )}
            </div>
          )}

          {source==="excel" && (
            <div style={{marginTop:8}}>
              <div
                style={{
                  fontSize:12,
                  color:COLORS.subtext,
                  marginBottom:4,
                  textAlign:"left"
                }}
              >
                Upload an Excel file with parent emails (prototype only — file upload not wired).
              </div>
              <button style={btnGhost}>Choose Excel File…</button>
            </div>
          )}

          {source==="sheets" && (
            <div style={{marginTop:8}}>
              <div
                style={{
                  fontSize:12,
                  color:COLORS.subtext,
                  marginBottom:4,
                  textAlign:"left"
                }}
              >
                Connect a Google Sheet with your roster (prototype only).
              </div>
              <button style={btnGhost}>Connect Google Sheets…</button>
            </div>
          )}

          {source==="manual" && (
            <div style={{marginTop:8}}>
              <div
                style={{
                  fontSize:12,
                  color:COLORS.subtext,
                  marginBottom:4,
                  textAlign:"left"
                }}
              >
                Paste emails. We’ll clean duplicates.
              </div>
              <Textarea
                value={manual}
                onChange={setManual}
                placeholder="email1@example.com, email2@example.com …"
              />
              <button
                style={{...btnGhost, marginTop:6}}
                onClick={parseManual}
              >
                Validate & Add
              </button>
            </div>
          )}

          <div style={{marginTop:10}}>
            <div
              style={{
                color:COLORS.subtext,
                fontSize:12,
                marginBottom:4,
                textAlign:"left"
              }}
            >
              Selected
            </div>
            {selected.length===0 ? (
              <div
                style={{
                  border:`1px dashed ${COLORS.border}`,
                  borderRadius:10,
                  padding:10,
                  color:COLORS.subtext,
                  fontSize:12,
                  textAlign:"left"
                }}
              >
                Nothing selected yet.
              </div>
            ) : (
              <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                {selected.map(s=>(
                  <span
                    key={s}
                    style={badge("rgba(148,163,184,0.1)", COLORS.text)}
                  >
                    {s}
                    <button
                      onClick={()=>removeSegment(s)}
                      aria-label={`Remove ${s}`}
                      style={{
                        background:"transparent",
                        border:"none",
                        color:COLORS.subtext,
                        marginLeft:6,
                        cursor:"pointer"
                      }}
                    >
                      ×
                    </button>
                  </span>
                ))}
              </div>
            )}
          </div>

          <div
            style={{
              display:"flex",
              justifyContent:"space-between",
              marginTop:10
            }}
          >
            <button style={btnGhost} onClick={onClose}>Cancel</button>
            <button
              style={{
                ...btnPrimary,
                opacity:selected.length?1:.6,
                textAlign:"center"
              }}
              disabled={!selected.length}
              onClick={()=>onApply(selected)}
            >
              Apply Audience
            </button>
          </div>
        </div>
      );
    }

    function PreviewOverlay({ step, subject, onClose, onSendTest }){
      const ref = useRef(null);
      const [showConfirm, setShowConfirm] = useState(false);
      const [hasSent, setHasSent] = useState(false);
      const [toastVisible, setToastVisible] = useState(false);

      useEffect(()=>{ ref.current?.focus(); },[]);
      const handleConfirmSend = () => {
        onSendTest?.();
        setHasSent(true);
        setShowConfirm(false);
        setToastVisible(true);
      };
      const handleUndo = () => {
        setHasSent(false);
        setToastVisible(false);
      };

      return (
        <div
          role="dialog"
          aria-modal="true"
          aria-label="Preview & Test"
          tabIndex={-1}
          ref={ref}
          onKeyDown={(e)=>e.key==="Escape"&&onClose()}
          style={{
            position:"fixed",
            inset:0,
            background:"rgba(15,23,42,0.45)",
            display:"grid",
            placeItems:"center",
            zIndex:200
          }}
        >
          <div
            style={{
              width:"min(650px, 90vw)",
              maxHeight:"80vh",
              overflow:"auto",
              background:COLORS.panel,
              border:`1px solid ${COLORS.border}`,
              borderRadius:12,
              padding:14,
              textAlign:"left",
              position:"relative"
            }}
          >
            <div
              style={{
                display:"flex",
                justifyContent:"space-between",
                alignItems:"center"
              }}
            >
              <h3 style={{margin:0, textAlign:"left"}}>Preview</h3>
              <button style={btnGhost} onClick={onClose}>✕</button>
            </div>

            <div
              style={{
                borderTop:`1px solid ${COLORS.border}`,
                marginTop:8,
                paddingTop:8
              }}
            >
              <div
                style={{
                  color:COLORS.subtext,
                  marginBottom:6,
                  fontSize:12,
                  textAlign:"left"
                }}
              >
                {step.type} Preview
              </div>

              {step.type==="Email" && (
                <div
                  style={{
                    border:`1px solid ${COLORS.border}`,
                    borderRadius:10,
                    padding:10,
                    background:COLORS.panelAlt,
                    textAlign:"left"
                  }}
                >
                  <div style={{marginBottom:6}}>
                    <strong>Subject:</strong> {subject || "(no subject)"}
                  </div>
                  <div
                    style={{
                      background:"#ffffff",
                      padding:10,
                      borderRadius:8,
                      border:`1px solid ${COLORS.border}`,
                      whiteSpace:"pre-wrap",
                      fontSize:13,
                      textAlign:"left"
                    }}
                  >
                    {step.body || "(empty)"}
                  </div>
                </div>
              )}
              {step.type==="SMS" && (
                <div
                  style={{
                    border:`1px solid ${COLORS.border}`,
                    borderRadius:10,
                    padding:10,
                    background:COLORS.panelAlt,
                    textAlign:"left"
                  }}
                >
                  <div style={{marginBottom:6}}>
                    <strong>SMS Body</strong>
                  </div>
                  <div
                    style={{
                      whiteSpace:"pre-wrap",
                      fontSize:13,
                      textAlign:"left"
                    }}
                  >
                    {step.body || "(empty)"}
                  </div>
                </div>
              )}
            </div>

            {showConfirm && (
              <div
                style={{
                  marginTop:10,
                  border:`1px solid ${COLORS.border}`,
                  borderRadius:10,
                  padding:10,
                  background:COLORS.panelAlt,
                  textAlign:"left"
                }}
              >
                <div style={{fontSize:13, marginBottom:6, textAlign:"left"}}>
                  Send a test to your account email? (prototype only)
                </div>
                <div style={{display:"flex", justifyContent:"flex-end", gap:8}}>
                  <button style={btnGhost} onClick={()=>setShowConfirm(false)}>Cancel</button>
                  <button style={btnPrimary} onClick={handleConfirmSend}>Send Test</button>
                </div>
              </div>
            )}

            {toastVisible && (
              <div
                style={{
                  position:"fixed",
                  left:"50%",
                  transform:"translateX(-50%)",
                  bottom:16,
                  background:COLORS.panel,
                  borderRadius:999,
                  border:`1px solid ${COLORS.border}`,
                  boxShadow:"0 10px 35px rgba(15,23,42,0.18)",
                  padding:"8px 16px",
                  display:"flex",
                  alignItems:"center",
                  gap:10,
                  fontSize:13,
                  zIndex:210
                }}
              >
                <span style={{textAlign:"left"}}>Test sent to your email (demo).</span>
                <button
                  style={{...btnGhost, padding:"4px 8px"}}
                  onClick={handleUndo}
                >
                  Undo
                </button>
                <button
                  style={{...btnGhost, padding:"4px 8px"}}
                  onClick={()=>setToastVisible(false)}
                >
                  Dismiss
                </button>
              </div>
            )}

            <div
              style={{
                display:"flex",
                justifyContent:"space-between",
                marginTop:10
              }}
            >
              <button style={btnGhost} onClick={onClose}>Back to edit</button>
              {!hasSent && !showConfirm && (
                <button style={btnPrimary} onClick={()=>setShowConfirm(true)}>Send Test</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function FormattingToolbar(){
      const btnStyle = {
        ...btnGhost,
        padding:"4px 6px",
        fontSize:11,
        borderRadius:6
      };
      return (
        <div
          style={{
            marginTop:6,
            borderTop:`1px solid ${COLORS.border}`,
            paddingTop:6,
            display:"flex",
            gap:4,
            flexWrap:"wrap",
            textAlign:"left"
          }}
        >
          <button type="button" style={btnStyle}><strong>B</strong></button>
          <button type="button" style={btnStyle}><em>I</em></button>
          <button type="button" style={btnStyle}>• List</button>
          <button type="button" style={btnStyle}>Link</button>
          <button type="button" style={btnStyle}>Personalize</button>
        </div>
      );
    }

    function ConfirmDialog({ title, body, confirmLabel, onConfirm, onCancel }) {
      const ref = useRef(null);
      useEffect(()=>{ ref.current?.focus(); },[]);
      return (
        <div
          role="dialog"
          aria-modal="true"
          aria-label={title}
          tabIndex={-1}
          ref={ref}
          onKeyDown={(e)=>e.key==="Escape"&&onCancel()}
          style={{
            position:"fixed",
            inset:0,
            background:"rgba(15,23,42,0.45)",
            display:"grid",
            placeItems:"center",
            zIndex:300
          }}
        >
          <div
            style={{
              width:"min(420px, 90vw)",
              background:COLORS.panel,
              border:`1px solid ${COLORS.border}`,
              borderRadius:12,
              padding:14,
              textAlign:"left",
              boxShadow:"0 18px 45px rgba(15,23,42,0.25)"
            }}
          >
            <h3 style={{marginTop:0, marginBottom:6, textAlign:"left"}}>{title}</h3>
            <p style={{marginTop:0, marginBottom:12, fontSize:13, color:COLORS.subtext, textAlign:"left"}}>
              {body}
            </p>
            <div style={{display:"flex", justifyContent:"flex-end", gap:8}}>
              <button style={btnGhost} onClick={onCancel}>Cancel</button>
              <button style={btnPrimary} onClick={onConfirm}>{confirmLabel}</button>
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------- Mount App ------------------------------- */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SendIQ.ioApp />);
  </script>
</body>
</html>

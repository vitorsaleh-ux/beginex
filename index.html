<!DOCTYPE html>

<body>
  <div id="root"></div>

  <!-- React + ReactDOM (production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <!-- Babel for inline JSX (for the prototype) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    /* -------------------------- Light Theme Tokens -------------------------- */
    const COLORS = {

      panel: "#ffffff",
      panelAlt: "#f9fafb",
      text: "#0f172a",

      success: "#15803d",
      border: "#e5e7eb",
      focus: "#93c5fd",
      rowWarnBg: "rgba(220,38,38,0.06)",
    };

    const focusRing = { outline: `2px solid ${COLORS.focus}`, outlineOffset: "2px" };
    const btnBase = {
      padding:"7px 11px",
      borderRadius:6,
      border:`1px solid ${COLORS.border}`,
      fontWeight:600,
      fontSize:"13px",
      lineHeight:1.25,
      cursor:"pointer",
      background:COLORS.panelAlt,
      color:COLORS.text
    };
    const btnPrimary = { ...btnBase, background:COLORS.primary, color:COLORS.primaryText, borderColor:COLORS.primary };
    const btnGhost = { ...btnBase, background:"transparent" };
    const badge = (bg, fg) => ({ display:"inline-block", padding:"2px 8px", borderRadius:999, background:bg, color:fg, fontSize:12 });

    const normalizeTime = (t) => t && t.trim() ? t : "09:00";

    /* ----------------------- KPI + Underperforming rules --------------------- */
    const KPI = {
      minDelivered: 200,
      email: { ctrWeak: 0.012, ctorWeak: 0.08, unsubRed: 0.005, spamRed: 0.0005, cooldownH: 72 },
      sms:   { ctrWeak: 0.12,  replyWeak: 0.02, unsubRed: 0.01,   cooldownH: 24 }
    };

    function hoursSince(dateISO) {
      if (!dateISO) return Infinity;
      const last = new Date(dateISO);
      const now = new Date();
      return (now - last) / 36e5;
    }
    function isCompleted(c) {
      const h = (c.channel === "SMS") ? KPI.sms.cooldownH : KPI.email.cooldownH;
      return !c.hasFutureSteps && hoursSince(c.lastSendAt) >= h;
    }
    function eligible(c) {
      const min = Math.max(KPI.minDelivered, Math.ceil(0.02 * (c.audienceCount || 0)));
      return (c.delivered || 0) >= min;
    }
    function underperforming(c) {
      if (!isCompleted(c) || !eligible(c)) return false;
      const goal = c.goal || "Engagement";
      if (goal === "Informational") {
        return (c.unsubRate || 0) >= KPI.email.unsubRed || (c.spamRate || 0) >= KPI.email.spamRed;
      }
      if (goal === "Conversion") {
        const convMiss = (c.convTarget != null) && ((c.conversionRate || 0) < c.convTarget);
        const weakEng = c.channel === 'SMS'
          ? (c.ctr || 0) < KPI.sms.ctrWeak
          : ((c.ctr || 0) < KPI.email.ctrWeak) || ((c.ctor ?? 1) < KPI.email.ctorWeak);
        return convMiss && weakEng;
      }
      return c.channel === 'SMS'
        ? (c.ctr || 0) < KPI.sms.ctrWeak
        : ((c.ctr || 0) < KPI.email.ctrWeak) || ((c.ctor ?? 1) < KPI.email.ctorWeak);
    }
    function buildUnderperfTooltip(c) {
      const parts = [];
      if (c.channel === "SMS") {
        if ((c.ctr || 0) < KPI.sms.ctrWeak) parts.push(`CTR ${(c.ctr*100||0).toFixed(1)}% (< ${(KPI.sms.ctrWeak*100).toFixed(1)}% target)`);
        if ((c.unsubRate || 0) >= KPI.sms.unsubRed) parts.push(`Unsub ${(c.unsubRate*100).toFixed(2)}% (high)`);
      } else {
        if ((c.ctr || 0) < KPI.email.ctrWeak) parts.push(`CTR ${(c.ctr*100||0).toFixed(1)}% (< ${(KPI.email.ctrWeak*100).toFixed(1)}% target)`);
        if ((c.ctor ?? 1) < KPI.email.ctorWeak) parts.push(`CTOR ${((c.ctor||0)*100).toFixed(1)}% (< ${(KPI.email.ctorWeak*100).toFixed(0)}% target)`);
        if ((c.unsubRate || 0) >= KPI.email.unsubRed) parts.push(`Unsub ${(c.unsubRate*100).toFixed(2)}% (high)`);
        if ((c.spamRate || 0) >= KPI.email.spamRed) parts.push(`Spam ${(c.spamRate*100).toFixed(2)}% (high)`);
      }
      return `Underperforming — ${parts.join("; ") || "below target"}. Click to revise.`;
    }

    /* ---------------------- Helpers for scheduling/AI time ------------------- */
    const addDays = (yyyyMmDd, n=0) => {
      if (!yyyyMmDd) return "";
      const d = new Date(yyyyMmDd+"T00:00:00");
      d.setDate(d.getDate() + Number(n||0));
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };
    const parseDelayDays = (txt) => {
      if (!txt) return 0;
      const m = String(txt).match(/(\d+)\s*d/i);
      return m ? parseInt(m[1],10) : 0;
    };
    function recommendTimeFor({ type, audienceSegments=[] }) {
      if (type === "SMS") return "17:00";
      const seed = audienceSegments.join("|").length % 5;
      const slots = ["09:00","10:30","11:15","14:00","16:45"];
      return slots[seed];
    }

    /* ------------------------ Campaign data (home list) ---------------------- */
    const initialCampaigns = [
      {
        id: 1,
        name: "Weekly Update 10/25",
        subject: "Your Weekly Class Update: New Features Inside",
        audience: "—",
        audienceCount: 1742,
        audienceLabels: ["All Contacts"],
        status: "Sent",
        sendTime: "Oct 25, 10:00 AM",
        opens: 540,
        clicks: 12,
        sequences: [],
        editable: false,
        channel: "Email",
        goal: "Engagement",
        delivered: 1700,
        ctr: 12/1700,
        ctor: 0.08,
        unsubRate: 0.001,
        spamRate: 0.0001,
        conversionRate: 0.0,
        convTarget: null,
        lastSendAt: "2025-10-25T10:00:00-04:00",
        hasFutureSteps: false
      },
      {
        id: 2,
        name: "Registration Reminder P1",
        subject: "Don't Miss Out! Registration Closes Tomorrow",
        audience: "—",
        audienceCount: 1742,
        audienceLabels: ["Class A","Class B"],
        status: "Scheduled",
        sendTime: "Nov 10, 3:00 PM",
        opens: "-",
        clicks: "-",
        sequences: [
          { delay: "3d", condition: "Non-openers", messageType: "SMS" },
          { delay: "7d", condition: "Everyone", messageType: "Email" },
        ],
        editable: true,
        channel: "Email",
        goal: "Engagement",
        delivered: 0,
        ctr: 0,
        ctor: 0,
        unsubRate: 0,
        spamRate: 0,
        lastSendAt: "2025-11-10T15:00:00-05:00",
        hasFutureSteps: true
      },
      {
        id: 3,
        name: "Summer Camp P1",
        subject: "Summer Camp Early Bird Discount",
        audience: "—",
        audienceCount: 3200,
        audienceLabels: ["Leads"],
        status: "Active",
        sendTime: "Sent 2 days ago",
        opens: 600,
        clicks: 80,
        sequences: [],
        editable: true,
        channel: "Email",
        goal: "Engagement",
        delivered: 2900,
        ctr: 80/2900,
        ctor: 0.12,
        unsubRate: 0.001,
        spamRate: 0.0001,
        lastSendAt: "2025-11-10T12:00:00-05:00",
        hasFutureSteps: false
      },
      {
        id: 4,
        name: "Mid-Campaign Test",
        subject: "Paused Mid-Campaign Test",
        audience: "—",
        audienceCount: 1010,
        audienceLabels: ["Leads","Session C1"],
        status: "Paused",
        sendTime: "Paused • Nov 1",
        opens: 100,
        clicks: 11,
        sequences: [
          { delay: "3d", condition: "Non-openers", messageType: "Email" },
        ],
        editable: true,
        channel: "Email",
        goal: "Engagement",
        delivered: 900,
        ctr: 11/900,
        ctor: 0.11,
        unsubRate: 0.001,
        spamRate: 0.0001,
        lastSendAt: "2025-11-01T09:00:00-04:00",
        hasFutureSteps: true
      },
    ];

    const STATUS_STYLES = {
      "Sent": badge("rgba(22,163,74,0.12)", COLORS.success),
      "Scheduled": badge("rgba(37,99,235,0.12)", COLORS.primary),
      "Draft": badge("#e2e8f0", COLORS.text),
      "Active": badge("rgba(37,99,235,0.12)", COLORS.primary),
      "Paused": badge("rgba(148,163,184,0.3)", "#475569"),
      "Completed": badge("rgba(148,163,184,0.18)", "#334155"),
    };

    /* --------------------------------- App ----------------------------------- */
    function BeAKampaignApp() {
      const [route, setRoute] = useState({ page:"dashboard", campaignId:null, step:0 });
      const [campaigns, setCampaigns] = useState(initialCampaigns);
      const [draftId, setDraftId] = useState(null);

      const startNew = () => {
        setRoute({ page:"create", campaignId:"new", step:0 });
        setDraftId(null);
      };
      const openCampaign = (id) => {
        setRoute({ page:"create", campaignId:id||"new", step:0 });
        setDraftId(id);
      };
      const openCampaignCompose = (id) => {
        setRoute({ page:"create", campaignId:id||"new", step:2 });
        setDraftId(id);
      };
      const openAnalytics = (id) => setRoute({ page:"create", campaignId:id, step:3 });

      const deleteCampaign = (id) => setCampaigns(p=>p.filter(c=>c.id!==id));
      const duplicateCampaign = (id) => {
        const orig = campaigns.find(c=>c.id===id); if(!orig) return;
        const copy = {
          ...orig,
          id: Date.now(),
          name: orig.name + " (Copy)",
          status: "Draft",
          sendTime: "—",
          opens: "-",
          clicks: "-",
          editable: true,
        };
        setCampaigns(p=>[copy, ...p]);
      };
      const togglePause = (id) => {
        setCampaigns(prev => prev.map(c => {
          if (c.id !== id) return c;
          if (c.status === "Paused") return { ...c, status: "Active" };
          if (c.status === "Active" || c.status === "Scheduled") {
            return { ...c, status: "Paused", sendTime: `Paused • ${new Date().toLocaleString()}` };
          }
          return c;
        }));
      };

      const ensureDraft = (partial) => {
        let createdId = draftId;
        if (!draftId) {
          createdId = Date.now();
          const newDraft = {
            id: createdId,
            name: partial.name || "Untitled campaign",
            subject: partial.subject || "(no subject)",
            audience: partial.audience || "—",
            audienceCount: partial.audienceCount || 0,
            audienceLabels: partial.audienceLabels || [],
            status: "Draft",
            sendTime: "Auto-saved",
            opens: "-",
            clicks: "-",
            sequences: partial.sequences || [],
            editable: true,
          };
          setCampaigns(prev => [newDraft, ...prev]);
          setDraftId(createdId);
        } else {
          setCampaigns(prev =>
            prev.map(c => c.id === draftId ? { ...c, ...partial } : c)
          );
        }
        return createdId;
      };
      const updateDraft = (id, partial) => {
        setCampaigns(prev =>
          prev.map(c => c.id === id ? { ...c, ...partial } : c)
        );
      };
      const handleLaunchedCampaign = (newCampaign) => {
        setCampaigns(prev => {
          const exists = prev.some(c => c.id === newCampaign.id);
          if (exists) {
            return prev.map(c => c.id === newCampaign.id ? newCampaign : c);
          }
          return [newCampaign, ...prev];
        });
        setDraftId(null);
        setRoute({ page:"dashboard", campaignId:null, step:0 });
      };
      const backToDashboard = () => setRoute({ page:"dashboard", campaignId:null, step:0 });

      const currentCampaign = route.campaignId && typeof route.campaignId === "number"
        ? campaigns.find(c=>c.id===route.campaignId) || null
        : null;

      return (
        <div style={{minHeight:"100vh", background:COLORS.bg, color:COLORS.text}}>
          <TopBar />
          <div style={{display:"flex", maxWidth:1200, margin:"0 auto"}}>
            <Sidebar current={route.page} onNav={setRoute} />
            <main style={{flex:1, padding:24}}>
              {route.page==="dashboard" && (
                <CampaignsDashboard
                  campaigns={campaigns}
                  onStartNew={startNew}
                  onOpen={openCampaign}
                  onDelete={deleteCampaign}
                  onDuplicate={duplicateCampaign}
                  onTogglePause={togglePause}
                  onComposeOneClick={openCampaignCompose}
                  onOpenAnalytics={openAnalytics}
                />
              )}
              {route.page==="create" && (
                <CreationFlow
                  onBackToDashboard={backToDashboard}
                  onLaunched={handleLaunchedCampaign}
                  onEnsureDraft={ensureDraft}
                  onUpdateDraft={updateDraft}
                  draftId={draftId}
                  currentCampaign={currentCampaign}
                  initialStep={route.step || 0}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    /* ------------------------------ Layout bits ------------------------------ */
    function TopBar(){
      return (
        <div style={{borderBottom:`1px solid ${COLORS.border}`, background:COLORS.panel}} role="banner">
          <div style={{maxWidth:1200, margin:"0 auto", padding:"14px 24px", display:"flex", alignItems:"center", gap:10}}>
            <div aria-hidden style={{width:26, height:26, borderRadius:6, background:"linear-gradient(135deg,#2563eb,#15803d)"}} />
            <div style={{fontWeight:800, letterSpacing:.2, fontSize:15}} aria-label="Product name">BeAKampaign</div>
          </div>
        </div>
      );
    }
    function Sidebar({ current, onNav }){
      const link = (label, page)=>(
        <button
          onClick={()=>onNav({page, campaignId:null, step:0})}
          style={{
            ...btnGhost,
            width:"100%",
            textAlign:"left",
            background: current===page?COLORS.panelAlt:"transparent",
            borderColor:"transparent",
            padding:"8px",
            color:COLORS.text
          }}
          onFocus={(e)=>e.currentTarget.style.outline=focusRing.outline}
          onBlur={(e)=>e.currentTarget.style.outline="none"}
          aria-current={current===page?"page":undefined}
        >
          <span>{label}</span>
        </button>
      );
      return (
        <nav aria-label="Primary" style={{width:200, borderRight:`1px solid ${COLORS.border}`, padding:14, background:COLORS.panel}}>
          {link("Campaigns","dashboard")}
          <div aria-hidden style={{height:6}}></div>
          {link("Settings (placeholder)","settings")}
        </nav>
      );
    }

    /* -------------------------- Campaigns Dashboard -------------------------- */
    function CampaignsDashboard({ campaigns, onStartNew, onOpen, onDelete, onDuplicate, onTogglePause, onComposeOneClick, onOpenAnalytics }){
      return (
        <section aria-label="Campaign list">
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
            <h1 style={{margin:0, fontSize:20}}>Campaigns</h1>
            <button style={btnPrimary} onClick={onStartNew}>New campaign</button>
          </div>
          <div style={{border:`1px solid ${COLORS.border}`, borderRadius:12, overflow:"hidden", background:COLORS.panel}}>
            <CampaignTableHeader />
            <div role="rowgroup">
              {campaigns.map(c=>(
                <CampaignTableRow
                  key={c.id}
                  data={c}
                  onOpen={()=>onOpen(c.id)}
                  onDelete={()=>onDelete(c.id)}
                  onDuplicate={()=>onDuplicate(c.id)}
                  onTogglePause={()=>onTogglePause(c.id)}
                  onComposeOneClick={()=>onComposeOneClick(c.id)}
                  onOpenAnalytics={()=>onOpenAnalytics(c.id)}
                />
              ))}
            </div>
          </div>
        </section>
      );
    }
    function CampaignTableHeader(){
      const th = { padding:"10px 12px", fontSize:11, color:COLORS.subtext, borderBottom:`1px solid ${COLORS.border}`, textTransform:"uppercase", letterSpacing:".03em" };
      return (
        <div role="row" style={{display:"grid", gridTemplateColumns:"1.4fr 1.4fr 0.8fr 1fr 1fr 0.6fr 48px", background:COLORS.panelAlt}}>
          <div role="columnheader" style={th}>Campaign Name</div>
          <div role="columnheader" style={th}>Audience</div>
          <div role="columnheader" style={th}>Status</div>
          <div role="columnheader" style={th}>Opens / Clicks</div>
          <div role="columnheader" style={th}>Send Time</div>
          <div role="columnheader" style={th}>Analytics</div>
          <div role="columnheader" style={th} aria-label="Actions">⋮</div>
        </div>
      );
    }
    const formatAudienceCell = (data) => {
      if (typeof data.audienceCount === "number" && Array.isArray(data.audienceLabels)) {
        const labels = data.audienceLabels.filter(l => l && l.toLowerCase() !== "parents");
        if (!labels.length || !data.audienceCount) return "—";
        const labelStr = labels.length > 3 ? `${labels.slice(0,3).join(", ")} +${labels.length-3}` : labels.join(", ");
        return `${data.audienceCount.toLocaleString()} · ${labelStr}`;
      }
      return "—";
    };
    function CampaignTableRow({ data, onOpen, onDelete, onDuplicate, onTogglePause, onComposeOneClick, onOpenAnalytics }){
      const [open, setOpen] = useState(false);
      const menuRef = useRef(null);
      const buttonRef = useRef(null);
      const [menuPos, setMenuPos] = useState({ top: 0, right: 0 });

      useEffect(()=>{
        const onDoc = (e)=>{
          if (!buttonRef.current || !menuRef.current) return;
          if (!buttonRef.current.contains(e.target) && !menuRef.current.contains(e.target)) {
             setOpen(false);
          }
        };
        document.addEventListener("mousedown", onDoc);
        return ()=>document.removeEventListener("mousedown", onDoc);
      },[]);
      const handleOpen = () => {
        if (!open) {
          const rect = buttonRef.current.getBoundingClientRect();
          setMenuPos({
            top: rect.bottom + 5,
            right: window.innerWidth - rect.right,
          });
        }
        setOpen(s => !s);
      };

      const isUnder = underperforming(data);
      const computedStatus = isCompleted(data) ? "Completed" : data.status;
      const statusChip = STATUS_STYLES[computedStatus] || badge("#e2e8f0", COLORS.text);

      return (
        <div
          role="row"
          style={{
            display:"grid",
            gridTemplateColumns:"1.4fr 1.4fr 0.8fr 1fr 1fr 0.6fr 48px",
            borderBottom:`1px solid ${COLORS.border}`,
            alignItems:"center",
            background: isUnder ? COLORS.rowWarnBg : "transparent"
          }}
        >
          <div role="cell" style={{padding:"10px 12px", display:"flex", alignItems:"center", gap:6}}>
            <button onClick={onOpen}
              style={{background:"transparent", border:"none", color:COLORS.interactive, textDecoration:"underline", cursor:"pointer", fontWeight:600, fontSize:13}}
            >
              {data.name}
            </button>
            {isUnder && (
              <button
                title={buildUnderperfTooltip(data)}
                aria-label="Underperforming campaign — click to revise"
                onClick={onComposeOneClick}
                style={{
                  background:"transparent",
                  border:"none",
                  cursor:"pointer",
                  lineHeight:1,
                  padding:0,
                  color:COLORS.warning,
                  fontSize:16
                }}
              >⚠️</button>
            )}
          </div>
          <div role="cell" style={{padding:"10px 12px", color:COLORS.subtext, fontSize:12}}>
            {formatAudienceCell(data)}
          </div>
          <div role="cell" style={{padding:"10px 12px"}}>
            <span style={statusChip}>{computedStatus}</span>
          </div>
          <div role="cell" style={{padding:"10px 12px", color:COLORS.subtext, fontSize:12}}>
            {data.opens} / {data.clicks}
          </div>
          <div role="cell" style={{padding:"10px 12px", color:COLORS.subtext, fontSize:12}}>
            {data.sendTime}
          </div>

          {/* Analytics column */}
          <div role="cell" style={{padding:"10px 12px"}}>
            <button style={{...btnPrimary, padding:"6px 12px"}} onClick={onOpenAnalytics}>View</button>
          </div>

          {/* Actions */}
          <div role="cell" style={{padding:"10px 6px", position:"relative"}}>
            <button
              ref={buttonRef}
              onClick={handleOpen}
              style={{
                ...btnGhost,
                width:26,
                height:26,
                padding:0,
                display:"grid",
                placeItems:"center",
                ...(isUnder ? { borderColor:COLORS.danger, color:COLORS.danger } : {})
              }}
              aria-haspopup="menu"
              aria-expanded={open}
            >
              ⋮
            </button>
            {open && (
              <div role="menu"
                ref={menuRef}
                style={{
                  position:"fixed",
                  right: menuPos.right,
                  top: menuPos.top,
                  background:COLORS.panel,
                  border:`1px solid ${COLORS.border}`,
                  borderRadius:10,
                  minWidth:180,
                  boxShadow:"0 12px 30px rgba(15,23,42,0.12)",
                  zIndex:1000
                }}
              >
                {isUnder && (
                  <MenuItem label="Compose one click" onClick={()=>{onComposeOneClick(); setOpen(false);}} />
                )}
                <MenuItem label="Open" onClick={()=>{onOpen(); setOpen(false);}} />
                <MenuItem label="Duplicate" onClick={()=>{onDuplicate(); setOpen(false);}} />
                {(data.status === "Active" || data.status === "Scheduled" || data.status === "Paused") && (
                  <MenuItem label={data.status === "Paused" ? "Resume" : "Pause"} onClick={()=>{onTogglePause(); setOpen(false);}} />
                )}
                <MenuItem label="Delete" danger onClick={()=>{ if(confirm("Delete campaign?")) onDelete(); setOpen(false); }} />
              </div>
            )}
          </div>
        </div>
      );
    }
    function MenuItem({ label, onClick, danger }){
      return (
        <button role="menuitem" onClick={onClick}
          style={{
            width:"100%",
            border:"none",
            background:"transparent",
            textAlign:"left",
            padding:"6px 10px",
            cursor:"pointer",
            color: danger?COLORS.danger:COLORS.text,
            fontSize:13
          }}
          onFocus={(e)=>e.currentTarget.style.outline=focusRing.outline}
          onBlur={(e)=>e.currentTarget.style.outline="none"}
        >
          {label}
        </button>
      );
    }

    /* ----------------------------- Creation Flow ----------------------------- */
    const STEPS = ["Create","Audience","Compose & Schedule","Review & Analytics"];
    const EMOJIS = ["🎉","✨","📣","✅","📅"];

    const getTodayDate = () => {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };
    const mapCampaignToSteps = (campaign) => {
      const mainStep = {
        id: "s1",
        type: "Email",
        date: getTodayDate(),
        time: normalizeTime(""),
        subject: campaign.subject || "",
        body: `Body content for ${campaign.name} - Step 1.`,
        autoStopRule: "None",
        useRecoTime: false
      };
      const sequenceSteps = (campaign.sequences || []).map((seq, index) => ({
        id: `s${index + 2}`,
        type: seq.messageType,
        daysOffset: parseDelayDays(seq.delay),
        time: normalizeTime(""),
        subject: `Follow-up ${index + 1} for ${campaign.subject}`,
        body: `Body content for ${campaign.name} - Step ${index + 2}.`,
        autoStopRule: "Stop if opened",
        useRecoTime: false
      }));
      return [mainStep, ...sequenceSteps];
    };

    function CreationFlow({ onBackToDashboard, onLaunched, onEnsureDraft, onUpdateDraft, draftId: externalDraftId, currentCampaign, initialStep }){
      const initialSteps = useMemo(() =>
        currentCampaign && typeof currentCampaign.id === "number"
          ? mapCampaignToSteps(currentCampaign)
          : [{ id:"s1", type:"Email", date:getTodayDate(), time:normalizeTime(""), subject:"", body:"", autoStopRule:"None", useRecoTime:false }]
      , [currentCampaign?.id]);

      const [activeStep, setActiveStep] = useState(initialStep || 0);
      const [campaignName, setCampaignName] = useState(currentCampaign?.name || "");
      const [fromSender, setFromSender] = useState("info@yourprogram.com");
      const initialSegments = currentCampaign?.audienceLabels || [];
      const [audienceSegments, setAudienceSegments] = useState(initialSegments);
      const [audPanelOpen, setAudPanelOpen] = useState(false);
      const [lastSaved, setLastSaved] = useState(null);
      const [internalDraftId, setInternalDraftId] = useState(externalDraftId || null);
      const [hasLaunched, setHasLaunched] = useState(false);
      const [steps, setSteps] = useState(initialSteps);
      const [activeMsgStepId, setActiveMsgStepId] = useState(initialSteps[0].id);
      const [previewOpen, setPreviewOpen] = useState(false);
      const [emojiOpen, setEmojiOpen] = useState(false);
      const [htmlMode, setHtmlMode] = useState(false);

      useEffect(() => {
        if (typeof currentCampaign?.id === "number") {
          setCampaignName(currentCampaign.name || "");
          setAudienceSegments(currentCampaign.audienceLabels || []);
          const loaded = mapCampaignToSteps(currentCampaign);
          setSteps(loaded);
          setActiveMsgStepId(loaded[0].id);
          setInternalDraftId(currentCampaign.id);
          setActiveStep(initialStep || 0);
          setHtmlMode(false);
        } else if (currentCampaign?.campaignId === "new" || currentCampaign === null) {
          if(campaignName !== "" || audienceSegments.length > 0 || steps.length > 1) {
            setCampaignName("");
            setAudienceSegments([]);
            const defaultSteps = [{ id:"s1", type:"Email", date:getTodayDate(), time:normalizeTime(""), subject:"", body:"", autoStopRule:"None", useRecoTime:false }];
            setSteps(defaultSteps);
            setActiveMsgStepId(defaultSteps[0].id);
            setActiveStep(initialStep || 0);
          }
          setInternalDraftId(null);
          setHtmlMode(false);
        }
      // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [currentCampaign?.id, initialStep]);

      const audienceCount = 1500 + audienceSegments.length*10;

      const canLaunch = useMemo(()=>{
        if(!campaignName.trim()) return false;
        if(audienceSegments.length===0) return false;
        if(steps.length===0) return false;
        for(const st of steps){
          if(st.id===steps[0].id){
            if(!st.date) return false;
            if(st.type==="Email" && !st.subject.trim()) return false;
          }
          if(!st.body.trim()) return false;
        }
        return true;
      },[campaignName, audienceSegments, steps]);

      const goNext = ()=>setActiveStep(s=>Math.min(s+1, STEPS.length-1));
      const goBack = ()=>setActiveStep(s=>Math.max(s-1, 0));

      const addStep = ()=>{
        const nextId = "s"+Math.random().toString(36).slice(2,7);
        const newStep = {
          id:nextId,
          type:"Email",
          daysOffset:3,
          time:"",
          subject:"",
          body:"",
          autoStopRule:"None",
          useRecoTime:false
        };
        setSteps(p=>[...p, newStep]);
        setActiveMsgStepId(nextId);
      };
      const resetSteps = ()=>{
        const only = { id:"s1", type:"Email", date:getTodayDate(), time:normalizeTime(""), subject:"", body:"", autoStopRule:"None", useRecoTime:false };
        setSteps([only]);
        setActiveMsgStepId("s1");
      };
      const updateStep = (id, patch)=> setSteps(p=>p.map(s=>s.id===id?{...s, ...patch}:s));
      const removeStep = (id)=>{
        setSteps(prev => {
          if (prev.length <= 1) return prev;
          const filtered = prev.filter(s=>s.id!==id);
          if (id === activeMsgStepId) {
            const last = filtered[filtered.length-1];
            setActiveMsgStepId(last.id);
          }
          return filtered;
        });
      };

      const activeEditorStep = steps.find(s=>s.id===activeMsgStepId) || steps[steps.length-1];
      const autoSave = (changed = {}) => {
        if (!campaignName.trim()) return;
        const baseDraft = {
          id: internalDraftId || undefined,
          name: campaignName,
          subject: steps[0]?.subject || "(no subject)",
          audience: audienceSegments.length ? `${audienceCount.toLocaleString()} (${audienceSegments.length>1?"Multiple segments":audienceSegments[0]})` : "—",
          audienceCount,
          audienceLabels: audienceSegments,
          sequences: steps.slice(1).map(st=>({
            delay: typeof st.daysOffset === "number" ? `${st.daysOffset}d` : (st.date || ""),
            condition: "Everyone",
            messageType: st.type
          })),
          ...changed
        };
        if (!internalDraftId) {
          const newId = onEnsureDraft(baseDraft);
          setInternalDraftId(newId);
        } else {
          onUpdateDraft(internalDraftId, baseDraft);
        }
        setLastSaved(new Date());
      };
      const handleLaunch = ()=>{
        if (!canLaunch) return;
        const mainStep = steps[0];
        const followUps = steps.slice(1).map((st)=>({
          delay: typeof st.daysOffset === "number" ? `${st.daysOffset}d` : (st.date || ""),
          condition: "Everyone",
          messageType: st.type
        }));
        const newCampaign = {
          id: internalDraftId || Date.now(),
          name: campaignName || "Untitled Campaign",
          subject: mainStep?.subject || "(no subject)",
          audience: audienceSegments.length ? `${audienceCount.toLocaleString()} (${audienceSegments.length>1?"Multiple segments":audienceSegments[0]})` : "—",
          audienceCount,
          audienceLabels: audienceSegments,
          status: "Active",
          sendTime: mainStep?.date ? `${mainStep.date} ${normalizeTime(mainStep.time)}` : "Just launched",
          opens: "-",
          clicks: "-",
          sequences: followUps,
          editable: true,
          channel: "Email",
          goal: "Engagement",
          delivered: audienceCount,
          ctr: 0,
          ctor: 0.1,
          unsubRate: 0,
          spamRate: 0,
          lastSendAt: new Date().toISOString(),
          hasFutureSteps: followUps.length>0
        };
        setHasLaunched(true);
        onLaunched(newCampaign);
      };
      const appendEmoji = (emoji)=>{
        updateStep(activeEditorStep.id, { body: (activeEditorStep.body || "") + emoji });
        setEmojiOpen(false);
      };

      const baseDate = steps[0]?.date;

      return (
        <section aria-label="Create campaign">
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
            <button style={btnGhost} onClick={onBackToDashboard}>← Back</button>
            {lastSaved && (
              <div style={{fontSize:11, color:COLORS.subtext}}>
                Auto-saved {lastSaved.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}
              </div>
            )}
          </div>

          <Stepper activeStep={activeStep} onStepClick={setActiveStep} />

          <div style={{marginTop:14}}>
            {activeStep===0 && (
              <Panel title="Create">
                <Labeled label="Campaign name" required>
                  <Input
                    placeholder="e.g., Summer Camp 2026 — Early Bird"
                    value={campaignName}
                    onChange={(val)=>{
                      setCampaignName(val);
                      if (val.trim()) autoSave({ name: val.trim() });
                    }}
                  />
                </Labeled>
                <FooterNav onBack={onBackToDashboard} onNext={goNext} nextLabel="next" nextDisabled={!campaignName.trim()} />
              </Panel>
            )}

            {activeStep===1 && (
              <Panel title="Audience">
                <Labeled label="From">
                  <Input
                    value={fromSender}
                    onChange={val=>{
                      setFromSender(val);
                      if (campaignName.trim()) autoSave({ from: val });
                    }}
                  />
                </Labeled>

                <Labeled label="Select audience" required
                  hint={audienceSegments.length ? `Multiple segments — total ${audienceCount.toLocaleString()}` : "Required"}>
                  <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
                    <div style={{padding:"8px 10px", borderRadius:10, border:`1px solid ${COLORS.border}`, background:COLORS.panelAlt, minWidth:240}} aria-live="polite">
                      {audienceSegments.length
                        ? `${audienceCount.toLocaleString()} · ${audienceSegments.length>1 ? "Multiple segments" : audienceSegments[0]}`
                        : "—"}
                    </div>
                    <button
                      style={btnPrimary}
                      onClick={()=>setAudPanelOpen(true)}
                      aria-controls="audience-panel" aria-expanded={audPanelOpen}>
                      Change
                    </button>
                  </div>
                </Labeled>

                {audienceSegments.length > 0 && (
                  <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
                    {audienceSegments.map(seg => (
                      <span key={seg} style={badge("rgba(148,163,184,0.1)", COLORS.text)}>{seg}</span>
                    ))}
                  </div>
                )}

                <FooterNav onBack={goBack} onNext={goNext} nextLabel="next" nextDisabled={audienceSegments.length===0}/>
                {audPanelOpen && (
                  <AudiencePanel id="audience-panel"
                    onClose={()=>setAudPanelOpen(false)}
                    onApply={(segments)=>{
                      setAudienceSegments(segments);
                      setAudPanelOpen(false);
                      if (campaignName.trim()) {
                        autoSave({
                          audience: segments.length
                            ? `${(1500 + segments.length*10).toLocaleString()} (${segments.length>1?"Multiple segments":segments[0]})`
                            : "—",
                          audienceCount: (1500 + segments.length*10),
                          audienceLabels: segments
                        });
                      }
                    }}
                    initialSelected={audienceSegments}
                  />
                )}
              </Panel>
            )}

            {activeStep===2 && (
              <Panel title="Compose & Schedule">
                <div style={{display:"grid", gridTemplateColumns:"260px 1fr", gap:14}}>
                  {/* Steps list */}
                  <div style={{border:`1px solid ${COLORS.border}`, borderRadius:12, background:COLORS.panelAlt, padding:10}}>
                    <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
                      <div style={{fontWeight:700, fontSize:14}}>Steps</div>
                      <button style={btnGhost} onClick={()=>{
                        resetSteps();
                        if (campaignName.trim()) autoSave({ sequences: [] });
                      }}>Reset</button>
                    </div>

                    {steps.map((st, idx)=>{
                      const isExpanded = st.id===activeMsgStepId;
                      const arriveDate = (idx===0) ? st.date : (baseDate ? addDays(baseDate, st.daysOffset||0) : "");
                      const stepPill = isExpanded
                        ? badge("rgba(37,99,235,0.12)", COLORS.primary) // blue when expanded (making selections)
                        : badge("rgba(148,163,184,0.25)", "#334155");     // gray when condensed
                      return (
                        <div key={st.id}
                          style={{border:`1px solid ${COLORS.border}`, borderRadius:10, background:COLORS.panel, padding:10, marginBottom:10}}>
                          {/* Header row (condensed view) */}
                          <div
                            style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, cursor: !isExpanded ? "pointer" : "default"}}
                            onClick={()=>{ if (!isExpanded) setActiveMsgStepId(st.id); }}
                          >
                            <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                              <span style={stepPill}>Step {idx+1}</span>
                              {!isExpanded && <span style={badge("rgba(148,163,184,0.15)", COLORS.subtext)}>{st.type}</span>}
                              {!isExpanded && arriveDate && (
                                <span style={{fontSize:11, color:COLORS.subtext}}>{arriveDate}</span>
                              )}
                            </div>
                            {!isExpanded && steps.length>1 && (
                              <button
                                title="Remove step"
                                onClick={(e)=>{
                                  e.stopPropagation();
                                  removeStep(st.id);
                                  if (campaignName.trim()) autoSave();
                                }}
                                style={{...btnGhost, padding:"2px 6px", color:COLORS.subtext}}
                              >×</button>
                            )}
                          </div>

                          {/* Expanded editor */}
                          {isExpanded && (
                            <div style={{marginTop:12, display:"grid", gap:12}}>
                              <TypeToggle value={st.type} onChange={(v)=>{
                                updateStep(st.id, {type:v});
                                if (campaignName.trim()) autoSave();
                                if (v !== "Email") setHtmlMode(false);
                              }}/>

                              {/* Scheduling controls */}
                              {idx===0 ? (
                                <div style={{display:"grid", gap:10}}>
                                  <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
                                    <Labeled label="Date" inline>
                                      <input type="date" value={st.date} onChange={e=>{
                                        updateStep(st.id,{date:e.target.value});
                                        if (campaignName.trim()) autoSave();
                                      }} style={inputStyle}/>
                                    </Labeled>
                                    <Labeled label="Time" inline>
                                      <input type="time" value={st.time} disabled={!!st.useRecoTime} onChange={e=>{
                                        updateStep(st.id,{time:e.target.value});
                                        if (campaignName.trim()) autoSave();
                                      }} style={inputStyle}/>
                                    </Labeled>
                                  </div>
                                  <div style={{marginTop:2}}>
                                    <label style={{display:"flex", alignItems:"center", gap:8, fontSize:13}}>
                                      <input
                                        type="checkbox"
                                        checked={!!st.useRecoTime}
                                        onChange={(e)=>{
                                          const checked = e.target.checked;
                                          const t = recommendTimeFor({type: st.type, audienceSegments});
                                          updateStep(st.id, { useRecoTime: checked, time: checked ? t : (st.time||"") });
                                          if (campaignName.trim()) autoSave();
                                        }}
                                      />
                                      <span>Send at recommended time</span>
                                    </label>
                                    <div style={{fontSize:11, color:COLORS.subtext, marginLeft:26}}>
                                      Based on past opens & clicks {st.useRecoTime && st.time ? `• ${st.time}` : ""}
                                    </div>
                                  </div>
                                </div>
                              ) : (
                                <div style={{display:"grid", gap:10}}>
                                  <Labeled label="Send this message in" inline>
                                    <div style={{display:"grid", gridTemplateColumns:"1fr auto", gap:8, alignItems:"center"}}>
                                      <input type="number" min="0" value={st.daysOffset ?? 0} onChange={(e)=>{
                                        updateStep(st.id,{daysOffset: Number(e.target.value)});
                                        if (campaignName.trim()) autoSave();
                                      }} style={inputStyle}/>
                                      <span style={{fontSize:13, color:COLORS.subtext}}>days</span>
                                    </div>
                                  </Labeled>
                                  <div style={{marginTop:2}}>
                                    <label style={{display:"flex", alignItems:"center", gap:8, fontSize:13}}>
                                      <input
                                        type="checkbox"
                                        checked={!!st.useRecoTime}
                                        onChange={(e)=>{
                                          const checked = e.target.checked;
                                          const t = recommendTimeFor({type: st.type, audienceSegments});
                                          updateStep(st.id, { useRecoTime: checked, time: checked ? t : "" });
                                          if (campaignName.trim()) autoSave();
                                        }}
                                      />
                                      <span>Send at recommended time</span>
                                    </label>
                                    <div style={{fontSize:11, color:COLORS.subtext, marginLeft:26}}>
                                      Based on past opens & clicks {st.useRecoTime && st.time ? `• ${st.time}` : ""}
                                    </div>
                                  </div>

                                  <Labeled label="Auto-stop rule">
                                    <select
                                      value={st.autoStopRule || "None"}
                                      onChange={e=>{
                                        updateStep(st.id, { autoStopRule: e.target.value });
                                        if (campaignName.trim()) autoSave();
                                      }}
                                      style={{...inputStyle}}
                                    >
                                      <option value="None">None</option>
                                      <option value="Stop if opened">Stop if opened</option>
                                      <option value="Stop if clicked">Stop if clicked</option>
                                    </select>
                                  </Labeled>
                                </div>
                              )}

                              <button style={{...btnGhost, width:"fit-content", padding:"4px 8px", marginTop:2}} onClick={()=>{
                                addStep();
                                if (campaignName.trim()) autoSave();
                              }}>+ Add step</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Editor for active step */}
                  <div style={{border:`1px solid ${COLORS.border}`, borderRadius:12, background:COLORS.panel, padding:10}}>
                    <div style={{display:"flex", justifyContent:"flex-end", alignItems:"center", marginBottom:8}}>
                      <button style={btnGhost} onClick={()=>setPreviewOpen(true)}>Preview & Test</button>
                    </div>

                    {activeEditorStep.type==="Email" && (
                      <Labeled label="Subject" required>
                        <Input placeholder="Write a clear, compelling subject…" value={activeEditorStep.subject} onChange={(v)=>{
                          updateStep(activeEditorStep.id,{subject:v});
                          if (campaignName.trim()) autoSave();
                        }}/>
                      </Labeled>
                    )}

                    <Labeled label={activeEditorStep.type==="Email" ? (htmlMode ? "Email body (HTML builder — mock)" : "Email body (plain)") : "SMS body (plain)"} required>
                      <div style={{display:"flex", gap:6, marginBottom:6, position:"relative"}}>
                        <button style={btnGhost} type="button" onClick={()=>setEmojiOpen(o=>!o)}>Emoji</button>
                        <button
                          style={{...btnGhost, ...(activeEditorStep.type!=="Email"?{opacity:.5, cursor:"not-allowed"}:{})}}
                          type="button"
                          onClick={()=> activeEditorStep.type==="Email" && setHtmlMode(m=>!m)}
                          aria-pressed={htmlMode}
                          title={activeEditorStep.type==="Email" ? "Toggle HTML builder (mock)" : "HTML builder available for Email only"}
                        >HTML</button>
                        {emojiOpen && (
                          <div style={{position:"absolute", top:30, left:0, background:COLORS.panel, border:`1px solid ${COLORS.border}`, borderRadius:10, padding:6, display:"flex", gap:6, zIndex:20, boxShadow:"0 10px 22px rgba(15,23,42,0.1)"}}>
                            {EMOJIS.map(e=>(
                              <button key={e} style={{background:"transparent", border:"none", fontSize:19, cursor:"pointer"}} onClick={()=>{
                                appendEmoji(e);
                                if (campaignName.trim()) autoSave();
                              }}>{e}</button>
                            ))}
                          </div>
                        )}
                      </div>

                      {activeEditorStep.type==="Email" && htmlMode ? (
                        <div style={{border:`1px dashed ${COLORS.border}`, borderRadius:10, padding:10, background:COLORS.panelAlt}}>
                          <div style={{fontSize:12, color:COLORS.subtext, marginBottom:8}}>
                            HTML builder mock (drag blocks disabled in prototype)
                          </div>
                          <div style={{border:`1px solid ${COLORS.border}`, borderRadius:8, overflow:"hidden", background:"#fff"}}>
                            <div style={{padding:"10px 12px", borderBottom:`1px solid ${COLORS.border}`, fontWeight:700, fontSize:13}}>
                              Camp Name
                            </div>
                            <div style={{display:"grid", gap:10, padding:12}}>
                              <div style={{height:120, border:`1px solid ${COLORS.border}`, borderRadius:8, display:"grid", placeItems:"center"}}>Image Block</div>
                              <div style={{border:`1px solid ${COLORS.border}`, borderRadius:8, padding:10}}>
                                <div style={{fontWeight:700, marginBottom:6}}>Headline</div>
                                <div style={{fontSize:13, color:COLORS.text}}>Replace this with your rich HTML content…</div>
                              </div>
                              <div style={{display:"flex", justifyContent:"center"}}>
                                <button style={{...btnPrimary, borderRadius:999}}>Primary CTA</button>
                              </div>
                            </div>
                          </div>
                        </div>
                      ) : (
                        <Textarea placeholder="Write your message…" value={activeEditorStep.body} onChange={(v)=>{
                          updateStep(activeEditorStep.id,{body:v});
                          if (campaignName.trim()) autoSave();
                        }}/>
                      )}
                    </Labeled>

                    <div style={{display:"flex", justifyContent:"space-between", marginTop:10}}>
                      <button style={btnGhost} onClick={goBack}>Back</button>
                      <div style={{display:"flex", gap:6}}>
                        <button style={btnPrimary} onClick={()=>setActiveStep(3)}>next</button>
                      </div>
                    </div>
                  </div>
                </div>

                {previewOpen && (
                  <PreviewOverlay
                    step={activeEditorStep}
                    subject={activeEditorStep.subject}
                    onClose={()=>setPreviewOpen(false)}
                    onSendTest={()=>{ alert("Test sent to your account email (demo)."); setPreviewOpen(false); }}
                  />
                )}
              </Panel>
            )}

            {activeStep===3 && (
              <Panel title="Review & Analytics">
                {/* Analytics row directly under the wizard */}
                <AnalyticsRow steps={steps} audienceCount={audienceCount} />

                {/* Summary below analytics */}
                <div style={{marginTop:14}}>
                  <div style={{border:`1px solid ${COLORS.border}`, borderRadius:12, padding:10, background:COLORS.panelAlt, display:"grid", gap:8}}>
                    <Row label="Campaign name" value={campaignName||"—"} />
                    <Row label="From" value={fromSender} />
                    <Row label="Audience" value={
                      audienceSegments.length
                        ? `${audienceCount.toLocaleString()} · ${audienceSegments.join(", ")}`
                        : "—"
                    } />
                    {audienceSegments.length > 0 && (
                      <div>
                        <div style={{color:COLORS.subtext, fontSize:12, marginBottom:4}}>Selected audiences</div>
                        <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                          {audienceSegments.map(seg => (
                            <span key={seg} style={badge("rgba(148,163,184,0.1)", COLORS.text)}>{seg}</span>
                          ))}
                        </div>
                      </div>
                    )}
                    <div>
                      <div style={{color:COLORS.subtext, fontSize:12, marginBottom:4}}>Steps</div>
                      <div style={{display:"grid", gap:6}}>
                        {steps.map((st,i)=>{
                          const arriveDate = (i===0) ? st.date : (steps[0]?.date ? addDays(steps[0].date, st.daysOffset||0) : "");
                          const timeText = st.useRecoTime ? `${st.time || recommendTimeFor({type: st.type})} (recommended)` : ((i===0 ? normalizeTime(st.time) : (st.time || "09:00")));
                          return (
                            <div key={st.id} style={{border:`1px solid ${COLORS.border}`, borderRadius:10, padding:8, background:COLORS.panel}}>
                              <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:4}}>
                                <span style={badge("rgba(37,99,235,0.12)", COLORS.primary)}>Step {i+1}</span>
                                <span style={badge("rgba(148,163,184,0.12)", COLORS.subtext)}>{st.type}</span>
                              </div>
                              <div style={{display:"grid", gap:3, fontSize:13}}>
                                <div style={{display:"flex", gap:12, alignItems:"center"}}>
                                  <strong>Send on:</strong>
                                  <span>{arriveDate || "No date"}</span>
                                  <span>{timeText}</span>
                                </div>
                                {st.type==="Email" && <div><strong>Subject:</strong> {st.subject || "—"}</div>}
                                <div>
                                  <strong>Body:</strong> {st.body ? st.body : "—"}
                                </div>
                                {i>0 && (
                                  <div>
                                    <strong>Auto-stop:</strong> {st.autoStopRule || "None"}
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <div style={{display:"flex", justifyContent:"space-between", marginTop:10}}>
                    <button style={btnGhost} onClick={()=>setActiveStep(2)}>Back</button>
                    <button style={{...btnPrimary, opacity:canLaunch?1:.6}} disabled={!canLaunch} onClick={handleLaunch}>Launch</button>
                  </div>
                </div>
              </Panel>
            )}
          </div>
        </section>
      );
    }

    /* -------------------------- Review & Analytics UI ------------------------ */
    function MetricCard({ label, value, sub }) {
      return (
        <div style={{flex:"1 1 160px", border:`1px solid ${COLORS.border}`, borderRadius:10, background:COLORS.panel, padding:"10px 12px"}}>
          <div style={{fontSize:11, color:COLORS.subtext, textTransform:"uppercase", letterSpacing:".03em", marginBottom:6}}>{label}</div>
          <div style={{fontSize:18, fontWeight:800}}>{value}</div>
          {sub && <div style={{fontSize:12, color:COLORS.subtext, marginTop:4}}>{sub}</div>}
        </div>
      );
    }
    function AnalyticsRow({ steps, audienceCount }) {
      // Simple demo numbers (replace with real once wired to backend)
      const delivered = audienceCount;
      const openRate = 0.36;
      const clickRate = 0.042;
      const unsubRate = 0.002;
      const spamRate = 0.0002;

      return (
        <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
          <MetricCard label="Delivered" value={delivered.toLocaleString()} />
          <MetricCard label="Open rate" value={(openRate*100).toFixed(1) + "%"} sub="vs. last 30 days: +2.1%" />
          <MetricCard label="Click rate" value={(clickRate*100).toFixed(1) + "%"} sub="vs. last 30 days: -0.3%" />
          <MetricCard label="Unsubscribe" value={(unsubRate*100).toFixed(2) + "%"} />
          <MetricCard label="Spam" value={(spamRate*100).toFixed(2) + "%"} />
        </div>
      );
    }

    /* -------------------------- Shared subcomponents ------------------------- */
    function Stepper({ activeStep, onStepClick }){
      return (
        <div role="navigation" aria-label="Creation steps"
             style={{display:"flex", gap:0, flexWrap:"nowrap", borderBottom:`1px solid ${COLORS.border}`}}>
          {STEPS.map((label, idx)=>{
            const active = idx===activeStep;
            return (
              <button
                key={label}
                onClick={()=>onStepClick(idx)}
                style={{
                  appearance:"none",
                  border:"none",
                  background:"transparent",
                  padding:"10px 16px",
                  fontWeight:700,
                  fontSize:"13px",
                  color: active ? COLORS.primary : COLORS.text,
                  borderBottom: `2px solid ${active ? COLORS.primary : "transparent"}`,
                  marginBottom:-1,
                  cursor:"pointer"
                }}
                aria-current={active?"step":undefined}
              >
                {label}
              </button>
            );
          })}
        </div>
      );
    }
    function Panel({ title, children }){
      return (
        <div style={{border:`1px solid ${COLORS.border}`, borderRadius:12, background:COLORS.panel, padding:14, marginTop:10}} role="region" aria-label={title}>
          <h2 style={{marginTop:0, fontSize:16}}>{title}</h2>
          {children}
        </div>
      );
    }
    function Labeled({ label, required, hint, inline, children }){
      return (
        <div style={{marginBottom:10}}>
          <div style={{display:inline?"inline-flex":"flex", alignItems:"baseline", gap:6, marginBottom:4}}>
            <label style={{fontWeight:600, fontSize:13}}>
              {label} {required && <span style={badge("rgba(220,38,38,0.12)", COLORS.danger)}>Required</span>}
            </label>
            {hint && <span style={{color:COLORS.subtext, fontSize:12}}>{hint}</span>}
          </div>
          {children}
        </div>
      );
    }
    const inputStyle = {
      background:COLORS.panelAlt,
      border:`1px solid ${COLORS.border}`,
      color:COLORS.text,
      padding:"8px 10px",
      borderRadius:8,
      width:"100%",
      fontSize:13
    };
    function Input({ value, onChange, placeholder }){
      const [local, setLocal] = useState(value||"");
      useEffect(()=>setLocal(value||""),[value]);
      return (
        <input type="text" value={local} placeholder={placeholder} style={inputStyle}
          onChange={(e)=>{ setLocal(e.target.value); onChange?.(e.target.value); }}
          onFocus={(e)=>{ e.currentTarget.style.outline=focusRing.outline; }}
          onBlur={(e)=>{ e.currentTarget.style.outline="none"; }}
        />
      );
    }
    function Textarea({ value, onChange, placeholder }){
      const [local, setLocal] = useState(value||"");
      useEffect(()=>setLocal(value||""),[value]);
      return (
        <textarea value={local} placeholder={placeholder} rows={7}
          style={{...inputStyle, fontFamily:"system-ui, sans-serif", resize:"vertical"}}
          onChange={(e)=>{ setLocal(e.target.value); onChange?.(e.target.value); }}
          onFocus={(e)=>{ e.currentTarget.style.outline=focusRing.outline; }}
          onBlur={(e)=>{ e.currentTarget.style.outline="none"; }}
        />
      );
    }
    function TypeToggle({ value, onChange }){
      const Item = ({ v })=>{
        const active = value===v;
        return (
          <button onClick={()=>onChange(v)}
            style={{...btnGhost, padding:"4px 8px", borderRadius:999, borderColor:active?COLORS.primary:COLORS.border, color:active?COLORS.primary:COLORS.text, background:active?"rgba(37,99,235,0.1)":COLORS.panelAlt, fontSize:12}}
            aria-pressed={active}>{v}</button>
        );
      };
      return <div role="group" aria-label="Message type" style={{display:"flex", gap:4}}><Item v="Email" /> <Item v="SMS" /></div>;
    }
    function Row({ label, value }){
      return (
        <div style={{display:"grid", gridTemplateColumns:"160px 1fr", gap:6}}>
          <div style={{color:COLORS.subtext, fontSize:12}}>{label}</div>
          <div style={{fontSize:13}}>{value}</div>
        </div>
      );
    }

    function AudiencePanel({ id, onClose, onApply, initialSelected=[] }){
      const [tab, setTab] = useState("BeAKid Audiences");
      const [selected, setSelected] = useState(initialSelected);
      const [manual, setManual] = useState("");

      useEffect(()=>{ const onEsc=(e)=> e.key==="Escape" && onClose(); document.addEventListener("keydown", onEsc); return ()=>document.removeEventListener("keydown", onEsc);},[onClose]);
      const addSegment = (seg)=> setSelected(p=> p.includes(seg)? p : [...p, seg]);
      const removeSegment = (seg)=> setSelected(p=> p.filter(s=>s!==seg));
      const parseManual = ()=>{
        const raw = manual.replace(/\s+/g," ").replace(/[\n;]/g,",").split(",").map(s=>s.trim()).filter(Boolean);
        const emails = Array.from(new Set(raw));
        const valid = emails.filter(e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e));
        const invalid = emails.filter(e=>!valid.includes(e));
        alert(`Parsed ${emails.length} entries.\nValid: ${valid.length}\nInvalid dropped: ${invalid.length}`);
        addSegment(`Manual list (${valid.length})`);
      };
      const segmentsDemo = ["All Contacts","Class A","Class A / Session A1","Class A / Session A2","Class B","Class C / Session C1"];

      return (
        <aside id={id} role="dialog" aria-modal="true" aria-label="Select audience"
          style={{position:"fixed", right:0, top:0, bottom:0, width:400, background:COLORS.panel, borderLeft:`1px solid ${COLORS.border}`, padding:14, boxShadow:"-16px 0 32px rgba(15,23,42,0.12)", zIndex:100}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <h3 style={{margin:0, fontSize:15}}>Select audience</h3>
            <button style={btnGhost} onClick={onClose} aria-label="Close audience panel">✕</button>
          </div>

          <div style={{display:"flex", gap:6, marginTop:10}}>
            {["BeAKid Audiences","Excel","Google Sheets","Manual"].map(t=>{
              const active = t===tab;
              return (
                <button key={t} onClick={()=>setTab(t)}
                  style={{...btnGhost, padding:"5px 9px", borderRadius:999, borderColor:active?COLORS.primary:COLORS.border, color:active?COLORS.primary:COLORS.text, background:active?"rgba(37,99,235,0.1)":COLORS.panelAlt, fontSize:12}}
                  aria-pressed={active}>{t}</button>
              );
            })}
          </div>

          <div style={{marginTop:10}}>
            {tab==="BeAKid Audiences" && (
              <div>
                <p style={{color:COLORS.subtext, marginTop:0, fontSize:12}}>Click classes/sessions to add:</p>
                <div style={{display:"grid", gap:6}}>
                  {segmentsDemo.map(s=>(
                    <button key={s} onClick={()=>addSegment(s)} style={{...btnGhost, justifyContent:"space-between", display:"flex", padding:"8px 9px", background:COLORS.panelAlt, fontSize:13}}>
                      <span>{s}</span><span style={{color:COLORS.subtext}}>→</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
            {tab==="Excel" && <p style={{color:COLORS.subtext, fontSize:12}}>Upload an Excel file (stub).</p>}
            {tab==="Google Sheets" && <p style={{color:COLORS.subtext, fontSize:12}}>Connect Google Sheets (stub).</p>}
            {tab==="Manual" && (
              <div>
                <p style={{color:COLORS.subtext, marginTop:0, fontSize:12}}>Paste emails. We’ll clean duplicates.</p>
                <Textarea value={manual} onChange={setManual} placeholder="email1@example.com, email2@example.com …" />
                <button style={{...btnGhost, marginTop:6}} onClick={parseManual}>Validate & add</button>
              </div>
            )}
          </div>

          <div style={{marginTop:10}}>
            <div style={{color:COLORS.subtext, fontSize:12, marginBottom:4}}>Selected</div>
            {selected.length===0 ? (
              <div style={{border:`1px dashed ${COLORS.border}`, borderRadius:10, padding:10, color:COLORS.subtext, fontSize:12}}>Nothing selected yet.</div>
            ) : (
              <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                {selected.map(s=>(
                  <span key={s} style={badge("rgba(148,163,184,0.1)", COLORS.text)}>
                    {s}
                    <button onClick={()=>removeSegment(s)} aria-label={`Remove ${s}`} style={{background:"transparent", border:"none", color:COLORS.subtext, marginLeft:6, cursor:"pointer"}}>×</button>
                  </span>
                ))}
              </div>
            )}
          </div>

          <div style={{position:"absolute", bottom:14, left:14, right:14, display:"flex", justifyContent:"space-between"}}>
            <button style={btnGhost} onClick={onClose}>Cancel</button>
            <button style={{...btnPrimary, opacity:selected.length?1:.6}} disabled={!selected.length} onClick={()=>{
              onApply(selected);
            }}>Apply</button>
          </div>
        </aside>
      );
    }

    function PreviewOverlay({ step, subject, onClose, onSendTest }){
      const ref = useRef(null);
      useEffect(()=>{ ref.current?.focus(); },[]);
      return (
        <div role="dialog" aria-modal="true" aria-label="Preview & Test" tabIndex={-1} ref={ref} onKeyDown={(e)=>e.key==="Escape"&&onClose()}
          style={{position:"fixed", inset:0, background:"rgba(15,23,42,0.45)", display:"grid", placeItems:"center", zIndex:200}}>
          <div style={{width:"min(650px, 90vw)", maxHeight:"80vh", overflow:"auto", background:COLORS.panel, border:`1px solid ${COLORS.border}`, borderRadius:12, padding:14}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <h3 style={{margin:0}}>Preview</h3>
              <button style={btnGhost} onClick={onClose}>✕</button>
            </div>

            <div style={{borderTop:`1px solid ${COLORS.border}`, marginTop:8, paddingTop:8}}>
              <div style={{color:COLORS.subtext, marginBottom:6, fontSize:12}}>{step.type} preview</div>

              {step.type==="Email" && (
                <div style={{border:`1px solid ${COLORS.border}`, borderRadius:10, padding:10, background:COLORS.panelAlt}}>
                  <div style={{marginBottom:6}}><strong>Subject:</strong> {subject || "(no subject)"}</div>
                  <div style={{background:"#ffffff", padding:10, borderRadius:8, border:`1px solid ${COLORS.border}`, whiteSpace:"pre-wrap", fontSize:13}}>
                    {step.body || "(empty)"}
                  </div>
                </div>
              )}
              {step.type==="SMS" && (
                <div style={{border:`1px solid ${COLORS.border}`, borderRadius:10, padding:10, background:COLORS.panelAlt}}>
                  <div style={{marginBottom:6}}><strong>SMS body</strong></div>
                  <div style={{whiteSpace:"pre-wrap", fontSize:13}}>{step.body || "(empty)"}</div>
                </div>
              )}
            </div>

            <div style={{display:"flex", justifyContent:"space-between", marginTop:10}}>
              <button style={btnGhost} onClick={onClose}>Back to edit</button>
              <button style={btnPrimary} onClick={onSendTest}>Send test</button>
            </div>
          </div>
        </div>
      );
    }
    function FooterNav({ onBack, onNext, nextLabel="next", nextDisabled }){
      return (
        <div style={{display:"flex", justifyContent:"space-between", marginTop:10}}>
          <button style={btnGhost} onClick={onBack}>Back</button>
          <button style={{...btnPrimary, opacity:nextDisabled?.valueOf()?0.6:1}} disabled={nextDisabled} onClick={onNext}>{nextLabel}</button>
        </div>
      );
    }

    /* ------------------------------- Mount App ------------------------------- */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<BeAKampaignApp />);
  </script>
</body>
</html>

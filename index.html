<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BeAKampaign – Campaign Prototyper</title>

  <!-- Tailwind config -->
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0052CC",
            "primary-hover": "#003E99",
            success: "#118D57",
            warning: "#B54708",
            danger: "#B42318",
            ink: "#1F2937",
            muted: "#4B5563",
            bg: "#F7F9FC",
            surface: "#FFFFFF",
            divider: "#E6EDF5",
          },
          borderRadius: { xl: "12px" }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { --r-xl: 12px }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, Apple Color Emoji, Segoe UI Emoji; }

    /* High-contrast primary */
    .btn-primary { background:#0052CC; color:#fff; border:2px solid #003E99; }
    .btn-primary:hover { background:#003E99; }
    .btn-primary:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(59,130,246,.5); }

    /* Secondary outline */
    .btn-outline { border:2px solid #374151; background:#fff; color:#111827; font-weight:700; }
    .btn-outline:hover { background:#F3F4F6; }
    .btn-outline:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(59,130,246,.35); }

    /* Segmented control for Delivery Channel */
    .seg { border:2px solid #374151; color:#111827; font-weight:700; }
    .seg.active { background:#0052CC; color:#fff; border-color:#003E99; }
    .seg:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(59,130,246,.5); }

    /* Text-style links (underline; not for CTAs) */
    .as-link {
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 2px;
    }
    .as-link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59,130,246,.5);
    }

    /* Chips */
    .chip { background:#E5E7EB; color:#111827; }

    /* Overflow menu panel */
    .menu-panel {
      min-width: 180px;
      background:#fff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      z-index: 40;
    }
    .menu-item {
      display:flex; align-items:center; gap:.5rem;
      width:100%; text-align:left; padding:.5rem .75rem;
      font-weight:700; color:#1F2937;
    }
    .menu-item:hover { background:#F3F4F6; }
    .menu-item:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(59,130,246,.35); border-radius: 10px; }

    /* Toggle pills for "When to send?" (very high contrast) */
    .toggle-pill {
      border:2px solid #111827; color:#111827; background:#FFFFFF; font-weight:800;
    }
    .toggle-pill[aria-pressed="true"] {
      background:#0052CC; color:#FFFFFF; border-color:#003E99;
    }
    .toggle-pill:hover { background:#F3F4F6; }
    .toggle-pill[aria-pressed="true"]:hover { background:#003E99; }

    /* Simple tooltip */
    .tooltip-group { position: relative; display: inline-flex; align-items: center; }
    .tooltip-bubble {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      white-space: nowrap; background: #111827; color:#fff; font-size:12px; font-weight:700;
      padding:6px 8px; border-radius:8px; box-shadow:0 6px 16px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .15s ease;
    }
    .tooltip-arrow {
      position:absolute; top:100%; left:50%; transform: translateX(-50%);
      width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid #111827;
    }
    .tooltip-group:hover .tooltip-bubble,
    .tooltip-group:focus-within .tooltip-bubble { opacity:1; }
  </style>
</head>

<body class="min-h-screen bg-bg text-ink">
  <div class="flex h-screen overflow-hidden">
    <!-- Left rail -->
    <nav class="w-16 bg-white flex flex-col items-center py-6 shadow-sm border-r border-divider">
      <span class="text-xl font-bold mb-8">B</span>
      <div class="flex flex-col gap-3">
        <button onclick="changePage('alerts')" class="relative p-2 rounded-lg text-muted hover:bg-gray-100" title="Dashboard/Alerts" aria-label="Alerts">
          <i data-lucide="bell" class="w-6 h-6"></i>
          <span class="absolute -top-0.5 -right-0.5 text-[10px] text-white bg-red-600 rounded-full h-4 w-4 grid place-items-center font-bold">2</span>
        </button>
        <button class="p-2 rounded-lg text-muted hover:bg-gray-100" title="Classes"><i data-lucide="graduation-cap" class="w-6 h-6"></i></button>
        <button class="p-2 rounded-lg text-muted hover:bg-gray-100" title="Payments"><i data-lucide="wallet" class="w-6 h-6"></i></button>

        <button onclick="changePage('list')" class="p-2 rounded-lg bg-blue-100 text-primary shadow-inner" title="BeAKampaign">
          <i data-lucide="send" class="w-6 h-6"></i>
        </button>

        <button class="p-2 rounded-lg text-muted hover:bg-gray-100" title="Settings"><i data-lucide="settings" class="w-6 h-6"></i></button>
      </div>
    </nav>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto p-8 relative">
      <header class="mb-6 flex items-center justify-between">
        <h1 id="main-header" class="text-3xl font-extrabold">BeAKampaign</h1>
        <!-- Top CTA (list page only) -->
        <div id="top-cta"></div>
      </header>

      <div id="app-container"></div>

      <!-- Global sheet -->
      <div id="global-sheet" class="fixed inset-0 hidden z-50" aria-hidden="true">
        <div class="absolute inset-0 bg-black/20" onclick="closeSheet()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-3xl bg-white rounded-xl shadow-xl p-6">
          <!-- injected -->
        </div>
      </div>

      <!-- Toasts -->
      <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 w-full max-w-sm z-50"></div>
    </main>

    <!-- Right drawer (shared for Schedule & Audience Picker) -->
    <aside id="drawer" class="fixed top-0 right-0 h-full w-[460px] bg-white shadow-2xl translate-x-full transition-transform duration-300 z-40" role="dialog" aria-modal="true">
      <!-- injected -->
    </aside>
    <div id="drawer-overlay" class="fixed inset-0 bg-black/20 opacity-0 pointer-events-none transition-opacity z-30" onclick="closeDrawer()"></div>
  </div>

  <script>
    // ---------- Icons
    function paintIcons() { if (window.lucide?.createIcons) lucide.createIcons(); }

    // ---------- State
    const MESSAGES = { EMAIL: "Email", SMS: "SMS", SOCIAL: "Social Post" };
    const CAMPAIGN_STATUS = { SENT: "Sent", SCHEDULED: "Scheduled", DRAFT: "Drafts", PAUSED: "Paused", ACTIVE: "Active" };
    const FOLLOWUP_STATUS = { ALERT: "Alert", COMPLETED: "Completed", SKIPPED: "Skipped" };

    const state = {
      page: "list",
      readOnly: false,
      drawerOpen: false,
      drawerMode: "schedule", // 'schedule' | 'audience'
      drawerStep: "schedule",
      messageType: MESSAGES.EMAIL,
      scheduleType: "now",
      scheduleTime: "",
      sequenceSteps: [],
      currentCampaign: null,
      isCampaignNameSet: true,
      isAudienceSet: true,
      currentComposeMode: 'scratch',
      openMenuFor: null, // which row's overflow menu is open

      campaigns: [
        { id: 1, subject: "Your Weekly Class Update: New Features Inside", name: "Weekly Update 10/25", type: MESSAGES.EMAIL, audience: "Parents (1,742)", status: CAMPAIGN_STATUS.SENT, sendTime: "Oct 25, 10:00 AM", opens: 54, clicks: 12, sequences: [], isEditable: false },
        { id: 2, subject: "Don't Miss Out! Registration Closes Tomorrow", name: "Registration Reminder P1", type: MESSAGES.EMAIL, audience: "Parents (1,742)", status: CAMPAIGN_STATUS.SCHEDULED, sendTime: "Nov 10, 3:00 PM", opens: "-", clicks: "-", sequences: [{ delay: "3d", condition: "Non-openers", messageType: MESSAGES.SMS }, { delay: "7d", condition: "Everyone", messageType: MESSAGES.EMAIL }], isEditable: true },
        { id: 3, subject: "Summer Camp Early Bird Discount", name: "Summer Camp P1", type: MESSAGES.EMAIL, audience: "Leads (3,200)", status: CAMPAIGN_STATUS.ACTIVE, sendTime: "Sent 2 days ago", opens: 600, clicks: 80, sequences: [], isEditable: true },
        { id: 4, subject: "Paused Mid-Campaign Test", name: "Mid-Campaign Test", type: MESSAGES.EMAIL, audience: "Leads (1,010)", status: CAMPAIGN_STATUS.PAUSED, sendTime: "Paused • Nov 1", opens: 100, clicks: 11, sequences: [{ delay: "3d", condition: "Non-openers", messageType: MESSAGES.EMAIL }], isEditable: true }
      ],
      templates: [
        { id: 201, name: "Seasonal Promo (Email)", type: MESSAGES.EMAIL, subject: "BIG Savings Inside!", body: "Use this template for major promotions. It includes a high-contrast CTA button ready for personalization." },
        { id: 202, name: "Enrollment Reminder (SMS)", type: MESSAGES.SMS, smsText: "Last chance to enroll! Don't miss out. [Link]" }
      ],
      followups: [
        { id: 101, campaignId: 3, campaignName: "Summer Camp P1", segment: "Non-Clickers (1,120)", description: "High-value prospects haven't clicked the camp link.", recommendedAction: "SMS follow-up using Template X", autoStopRule: "Reply to any message", status: FOLLOWUP_STATUS.ALERT },
        { id: 102, campaignId: 2, campaignName: "Registration Reminder P1", segment: "Non-Openers (380)", description: "Segment hasn't opened the final registration reminder.", recommendedAction: "Send Email with new subject line.", autoStopRule: "Class-full status", status: FOLLOWUP_STATUS.ALERT },
        { id: 103, campaignId: 1, campaignName: "Weekly Update 10/25", segment: "Low-Engagement (52)", description: "Completed last week with low open rate in this segment.", recommendedAction: "Send an SMS survey.", autoStopRule: "Payment received", status: FOLLOWUP_STATUS.COMPLETED }
      ],
      compose: {
        subject: "New Campaign Draft",
        name: "New Campaign Draft",
        audience: "None Selected",
        audienceId: null,
        previewText: "",
        body: "Start with a clean slate for your rich HTML content.",
        smsText: "Start typing your SMS here. [Link]",
        socialCaption: "Write a new social post caption.",
        mediaUrl: "https://placehold.co/400x200/4c7ff5/ffffff?text=Media+Placeholder",
        isUnlayerOpen: false,
        isSending: false
      }
    };

    // ---------- Shorthands + caret helpers
    const $ = (id) => document.getElementById(id);

    function saveCaret() {
      const el = document.activeElement;
      if (!el || !el.id) return null;
      const data = { id: el.id };
      try { if ('selectionStart' in el) { data.start = el.selectionStart; data.end = el.selectionEnd; } } catch(e){}
      return data;
    }
    function restoreCaret(saved) {
      if (!saved) return;
      const el = document.getElementById(saved.id);
      if (!el) return;
      el.focus({ preventScroll: true });
      try {
        if (typeof saved.start === 'number' && typeof saved.end === 'number' && 'setSelectionRange' in el) {
          el.setSelectionRange(saved.start, saved.end);
        }
      } catch(e){}
    }

    function toast(msg, type = "info", ms = 3000) {
      const m = {
        info: "bg-blue-100 text-blue-800 border-blue-300",
        success: "bg-green-100 text-green-800 border-green-300",
        danger: "bg-red-100 text-red-800 border-red-300",
      }[type];
      const icon = { info: "info", success: "check-circle", danger: "alert-triangle" }[type];
      const el = document.createElement("div");
      el.className = `p-3 mb-2 rounded-xl border shadow ${m} opacity-0 translate-y-2 transition-all`;
      el.innerHTML = `<div class="flex items-center gap-2"><i data-lucide="${icon}" class="w-5 h-5"></i><span>${msg}</span></div>`;
      $("toast").appendChild(el);
      paintIcons();
      requestAnimationFrame(() => {
        el.classList.remove("opacity-0", "translate-y-2");
        el.classList.add("opacity-100", "translate-y-0");
      });
      setTimeout(() => {
        el.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => el.remove(), 200);
      }, ms);
    }

    // ---------- Page nav
    function changePage(page, opts = {}) {
      state.page = page;
      state.readOnly = !!opts.readOnly;
      closeDrawer();
      closeSheet();
      state.openMenuFor = null; // close any open overflow menus
      render();
      const mh = $("main-header");
      if (mh) {
        mh.textContent =
          page === "alerts" ? "Follow-up Alerts" :
          page === "compose" ? (opts.readOnly ? `Campaign Detail: ${state.currentCampaign?.name || ""}` : "Compose Campaign") :
          "BeAKampaign";
      }
    }

    function newCampaign() {
      state.currentCampaign = null;
      state.messageType = MESSAGES.EMAIL;
      Object.assign(state.compose, {
        subject: "New Campaign Draft",
        name: "New Campaign Draft",
        audience: "None Selected",
        audienceId: null,
        previewText: "",
        body: "Start with a clean slate for your rich HTML content.",
        smsText: "Start typing your SMS here. [Link]",
        socialCaption: "Write a new social post caption.",
        isUnlayerOpen: false
      });
      state.sequenceSteps = [];
      state.isCampaignNameSet = false;
      state.isAudienceSet = false;
      changePage("compose");
    }

    function viewCampaignDetails(id) {
      const c = state.campaigns.find(x => x.id === id);
      if (!c) return toast("Campaign not found", "danger");
      state.currentCampaign = c;
      state.messageType = c.type;
      state.readOnly = true;
      Object.assign(state.compose, {
        subject: c.subject,
        name: c.name,
        audience: c.audience,
        previewText: c.previewText || "",
        body: "This is the final sent content (read-only view).",
        isUnlayerOpen: false
      });
      state.isCampaignNameSet = true;
      state.isAudienceSet = true;
      state.sequenceSteps = JSON.parse(JSON.stringify(c.sequences));
      changePage("compose", { readOnly: true });
    }

    function editCampaign(id) {
      const c = state.campaigns.find(x => x.id === id);
      if (!c || !c.isEditable) return toast("This campaign is read-only (Sent).", "info");
      state.currentCampaign = c;
      state.messageType = c.type;
      state.readOnly = false;
      Object.assign(state.compose, {
        subject: c.subject,
        name: c.name,
        audience: c.audience,
        previewText: c.previewText || "",
        body: "Restoring content from prior campaign...",
        isUnlayerOpen: false
      });
      state.isCampaignNameSet = true;
      state.isAudienceSet = true;
      state.sequenceSteps = JSON.parse(JSON.stringify(c.sequences));
      changePage("compose", { readOnly: false });
    }

    // ---------- Compose handlers (caret preserve)
    function updateCompose(field, value) {
      if (state.readOnly) return;
      state.compose[field] = value;
      if (field === "subject" && state.compose.name === "New Campaign Draft") {
        state.compose.name = value;
      }
      if (field === "name") {
        state.isCampaignNameSet = value.trim().length > 0;
      } else {
        state.isCampaignNameSet = state.compose.name.trim().length > 0;
      }
      const saved = saveCaret();
      renderCompose();
      restoreCaret(saved);
    }

    function handleModeChange(mode) {
      if (mode === 'scratch') changeComposeMode('scratch');
      else renderSheet('source-selection', mode);
    }

    function changeComposeMode(mode, source = null) {
      state.currentComposeMode = mode;
      state.messageType = MESSAGES.EMAIL;
      state.compose.isUnlayerOpen = false;

      if (mode === 'template' && source) {
        Object.assign(state.compose, { subject: source.subject, body: source.body, smsText: source.smsText || "Start typing... [Link]" });
        state.messageType = source.type;
      } else if (mode === 'reuse' && source) {
        Object.assign(state.compose, { subject: `Reusing: ${source.name}`, body: `Content loaded from campaign: ${source.name}.` });
        state.messageType = source.type;
      } else if (mode === 'scratch') {
        Object.assign(state.compose, { subject: "New Campaign Draft", body: "Start with a clean slate for your rich HTML content.", smsText: "Start typing... [Link]" });
      }
      const saved = saveCaret();
      renderCompose();
      restoreCaret(saved);
    }

    // ---------- Audience picker
    function openAudienceDrawer() {
      if (state.readOnly) return;
      state.drawerOpen = true;
      state.drawerMode = 'audience';
      $("drawer").classList.remove("translate-x-full");
      $("drawer-overlay").classList.remove("opacity-0", "pointer-events-none");
      renderDrawer();
      const focusable = $("drawer").querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (focusable.length > 0) focusable[0].focus();
    }

    function selectBeAKidAudience() {
      state.compose.audience = "New Segment (1,500)";
      state.compose.audienceId = "mock-beakid-001";
      state.isAudienceSet = true;
      toast("Audience set: New Segment (1,500)", "success");
      closeDrawer();
      renderCompose();
    }

    function selectAudienceSource(source) { toast(`${source} connection coming soon`, "info"); }

    function mockSetAudience(segment) {
      if (state.readOnly) return;
      state.compose.audience = segment;
      state.compose.audienceId = 'mock-id-123';
      state.isAudienceSet = true;
      toast(`Audience set to: ${segment}`, 'info');
      renderCompose();
    }

    function changeMessageType(newType) {
      if (state.readOnly) return;
      state.messageType = newType;
      state.compose.isUnlayerOpen = false;
      const saved = saveCaret();
      renderCompose();
      restoreCaret(saved);
    }

    function toggleUnlayer() {
      if (state.readOnly) return;
      state.compose.isUnlayerOpen = !state.compose.isUnlayerOpen;
      const saved = saveCaret();
      renderCompose();
      restoreCaret(saved);
    }

    // ---------- Drawer (Schedule & Audience)
    function openDrawer() {
      if (state.readOnly) return toast("Cannot schedule, viewing in read-only mode.", "info");
      if (!state.isCampaignNameSet || !state.isAudienceSet) {
        return toast("Campaign Name and Audience are required before scheduling.", "danger");
      }
      state.drawerOpen = true;
      state.drawerMode = 'schedule';
      state.drawerStep = 'schedule';
      $("drawer").classList.remove("translate-x-full");
      $("drawer-overlay").classList.remove("opacity-0", "pointer-events-none");
      renderDrawer();
      const focusable = $("drawer").querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (focusable.length > 0) focusable[0].focus();
    }
    function closeDrawer() {
      state.drawerOpen = false;
      $("drawer").classList.add("translate-x-full");
      $("drawer-overlay").classList.add("opacity-0", "pointer-events-none");
    }

    function renderDrawer() {
      if (!state.drawerOpen) { $("drawer").innerHTML = ''; return; }

      if (state.drawerMode === 'audience') {
        $("drawer").setAttribute("aria-label", "Select Audience");
        $("drawer").innerHTML = `
          <div class="p-6 border-b border-divider flex justify-between items-center">
            <h2 class="text-xl font-extrabold">Select Audience</h2>
            <button onclick="closeDrawer()" class="text-muted hover:text-ink p-2 rounded-full" aria-label="Close audience picker"><i data-lucide="x" class="w-6 h-6"></i></button>
          </div>
          <div class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="grid gap-3">
              <button onclick="selectBeAKidAudience()" class="w-full p-4 rounded-xl btn-primary flex items-center justify-between">
                <span class="font-extrabold">Your BeAKid Audiences</span>
                <i data-lucide="check-circle" class="w-5 h-5"></i>
              </button>
              <button onclick="selectAudienceSource('Excel upload')" class="w-full p-4 rounded-xl btn-outline flex items-center justify-between">
                <span class="font-extrabold">Excel</span>
                <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
              </button>
              <button onclick="selectAudienceSource('Google Sheets')" class="w-full p-4 rounded-xl btn-outline flex items-center justify-between">
                <span class="font-extrabold">Google Sheets</span>
                <i data-lucide="sheet" class="w-5 h-5"></i>
              </button>
              <button onclick="selectAudienceSource('Manual entry')" class="w-full p-4 rounded-xl btn-outline flex items-center justify-between">
                <span class="font-extrabold">Manual</span>
                <i data-lucide="keyboard" class="w-5 h-5"></i>
              </button>
            </div>
            <p class="text-sm text-muted mt-4">Tip: You can refine segments later with filters (tags, activity, enrollments).</p>
          </div>
        `;
        paintIcons();
        return;
      }

      // Schedule drawer
      const isPreflight = state.drawerStep === 'preflight';
      const sequences = state.sequenceSteps.map((step, i) => `
        <div class="p-3 bg-gray-50 rounded-xl border border-divider flex items-center gap-3 mb-2">
          <span class="font-bold text-lg text-primary">S${i + 2}</span>
          <div class="flex-1 grid grid-cols-3 gap-2">
            <select onchange="updateSequenceStep(${i}, 'delay', this.value)" class="w-full p-2 border-2 border-gray-800 rounded-lg text-sm bg-white">
                <option value="1d" ${step.delay === '1d' ? 'selected' : ''}>Delay: 1d</option>
                <option value="3d" ${step.delay === '3d' ? 'selected' : ''}>Delay: 3d</option>
                <option value="7d" ${step.delay === '7d' ? 'selected' : ''}>Delay: 7d</option>
            </select>
            <select onchange="updateSequenceStep(${i}, 'condition', this.value)" class="w-full p-2 border-2 border-gray-800 rounded-lg text-sm bg-white">
                <option value="Non-openers" ${step.condition === 'Non-openers' ? 'selected' : ''}>Non-openers</option>
                <option value="Non-clickers" ${step.condition === 'Non-clickers' ? 'selected' : ''}>Non-clickers</option>
                <option value="Everyone" ${step.condition === 'Everyone' ? 'selected' : ''}>Everyone</option>
            </select>
            <select onchange="updateSequenceStep(${i}, 'messageType', this.value)" class="w-full p-2 border-2 border-gray-800 rounded-lg text-sm bg-white">
                ${[MESSAGES.EMAIL, MESSAGES.SMS, MESSAGES.SOCIAL].map(t => `<option value="${t}" ${step.messageType === t ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
          </div>
          <button onclick="removeSequenceStep(${i})" class="text-gray-700 hover:text-danger p-1" aria-label="Remove step"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>`).join('');

      const preflightSheet = `
        <div class="absolute inset-0 bg-white/85 backdrop-blur-sm transition-opacity ${isPreflight ? 'opacity-100' : 'opacity-0 invisible'} z-10">
          <div class="absolute inset-0 p-6 flex flex-col bg-white border-l border-divider">
            <div class="flex justify-between items-center pb-4 border-b border-divider">
              <h3 class="text-xl font-extrabold flex items-center gap-2"><i data-lucide="shield-check" class="w-6 h-6 text-primary"></i>Pre-flight Check</h3>
              <button onclick="togglePreflightSheet()" class="text-muted hover:text-ink p-1" aria-label="Close pre-flight"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="py-4 space-y-3 flex-1 overflow-y-auto">
              <div class="p-3 bg-green-50 rounded-lg border border-green-300 text-sm font-semibold"><strong>PASSED:</strong> Subject Line</div>
              <div class="p-3 bg-yellow-50 rounded-lg border border-yellow-300 text-sm font-semibold"><strong>WARNING:</strong> 1/3 Links Unsecure</div>
              <div class="p-3 bg-green-50 rounded-lg border border-green-300 text-sm font-semibold"><strong>PASSED:</strong> Audience Valid</div>
              <div class="p-3 bg-green-50 rounded-lg border border-green-300 text-sm font-semibold"><strong>PASSED:</strong> Sequence logic OK</div>
            </div>
            <button onclick="togglePreflightSheet()" class="py-2 px-4 w-full rounded-xl btn-primary font-extrabold">Return</button>
          </div>
        </div>`;

      $("drawer").setAttribute("aria-label", "Schedule Campaign");
      $("drawer").innerHTML = `
        <div class="p-6 border-b border-divider flex justify-between items-center">
          <h2 class="text-xl font-extrabold">Schedule Campaign</h2>
          <button onclick="closeDrawer()" class="text-muted hover:text-ink p-2 rounded-full" aria-label="Close drawer"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-8">
          <div>
            <h3 class="font-extrabold text-ink mb-2">Recipients</h3>
            <div class="p-3 bg-gray-50 rounded-lg text-sm text-ink flex items-center gap-2 border border-gray-200"><i data-lucide="users" class="w-4 h-4"></i>${state.compose.audience}</div>
          </div>
          <div>
            <h3 class="font-extrabold text-ink mb-3">When to send?</h3>
            <div class="flex gap-4 mb-4">
              <button
                onclick="state.scheduleType='now'; renderDrawer();"
                class="flex-1 py-3 rounded-xl toggle-pill"
                aria-pressed="${state.scheduleType === 'now' ? 'true' : 'false'}"
              >
                Send now
              </button>
              <button
                onclick="state.scheduleType='later'; renderDrawer();"
                class="flex-1 py-3 rounded-xl toggle-pill"
                aria-pressed="${state.scheduleType === 'later' ? 'true' : 'false'}"
              >
                Send later
              </button>
            </div>
            ${state.scheduleType === 'later' ? `
              <div class="space-y-3 p-3 bg-gray-50 rounded-lg border border-gray-300">
                <label class="block text-sm font-bold">Date &amp; Time</label>
                <input type="datetime-local" onchange="state.scheduleTime=this.value" class="w-full p-2 border-2 border-gray-800 rounded-lg bg-white">
                <div class="tooltip-group mt-1">
                  <button onclick="toast('AI time applied!', 'info')" class="text-sm font-extrabold text-primary as-link inline-flex items-center gap-1" aria-describedby="ai-tip">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    AI recommend time
                  </button>
                  <div id="ai-tip" role="tooltip" class="tooltip-bubble">
                    AI-recommended launch time based on open/click data
                    <span class="tooltip-arrow"></span>
                  </div>
                </div>
              </div>` : ''}
          </div>
          <div>
            <h3 class="font-extrabold text-ink mb-3">Add Follow-ups (Sequences)</h3>
            <div class="space-y-3">${sequences || '<p class="text-sm text-muted p-2">No follow-ups added.</p>'}</div>
            <button onclick="addSequenceStep()" class="mt-3 w-full py-2 px-4 rounded-xl border-2 border-gray-800 font-extrabold hover:bg-gray-100 flex items-center justify-center gap-2"><i data-lucide="plus" class="w-5 h-5"></i>+ Add step</button>
          </div>
          <div class="pt-4 border-t border-divider">
            <button onclick="togglePreflightSheet()" class="w-full py-2 px-4 rounded-xl border-2 border-gray-800 font-extrabold hover:bg-gray-100 flex items-center justify-center gap-2"><i data-lucide="shield-check" class="w-5 h-5"></i>Run Pre-flight check</button>
          </div>
        </div>
        <div class="p-6 border-t border-divider flex justify-end gap-3">
          <button onclick="closeDrawer()" class="py-2 px-4 rounded-xl border-2 border-gray-800 font-extrabold hover:bg-gray-100">Cancel</button>
          <button onclick="handleSubmit()" class="py-2 px-4 rounded-xl btn-primary font-extrabold flex items-center gap-2 ${state.compose.isSending ? 'opacity-70' : ''}" ${state.compose.isSending ? 'disabled' : ''}>
            ${state.compose.isSending
              ? '<i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>Processing...'
              : `<i data-lucide="send" class="w-5 h-5"></i>${state.scheduleType === 'now' ? 'Launch' : 'Schedule'}`}
          </button>
        </div>
        ${preflightSheet}
      `;
      paintIcons();
    }

    // ---------- Sheet (source selection + preview)
    function renderSheet(mode, context) {
      let content, title;
      const sheet = $("global-sheet").querySelector("div:last-child");

      if (mode === 'details' || mode === 'confirm') {
        const alert = state.followups.find(a => a.id === (mode === 'details' ? context.id : context));
        if (!alert) return;
        if (mode === 'details') {
          title = `Follow-up Details: ${alert.campaignName}`;
          content = `<div class="space-y-4">
            <div class="p-3 bg-gray-50 rounded-lg"><h4 class="text-sm font-semibold text-muted">Segment</h4><p class="font-medium text-lg text-danger">${alert.segment}</p><p class="text-xs text-muted">${alert.description}</p></div>
            <div class="p-3 bg-blue-50 rounded-lg"><h4 class="text-sm font-semibold text-muted">Recommended Action</h4><p class="font-medium text-lg text-primary">${alert.recommendedAction}</p></div>
            <div class="p-3 bg-yellow-50 rounded-lg"><h4 class="text-sm font-semibold text-muted">Auto-Stop Rule</h4><p class="text-sm text-yellow-700">${alert.autoStopRule}</p></div>
          </div>
          <div class="mt-8 flex justify-between gap-4">
            <button onclick="renderSheet('confirm', ${alert.id})" class="flex-1 py-2 px-4 rounded-xl btn-primary font-semibold flex items-center justify-center gap-2"><i data-lucide="check-circle" class="w-5 h-5"></i>One-Click Send</button>
            <button onclick="startManualFollowUp(${alert.id})" class="flex-1 py-2 px-4 rounded-xl border-2 border-gray-400 font-semibold hover:bg-gray-100 flex items-center justify-center gap-2"><i data-lucide="edit" class="w-5 h-5"></i>Manual Compose</button>
          </div>`;
        } else {
          title = `Confirm One-Click Follow-Up`;
          content = `<div class="space-y-6 text-center">
            <i data-lucide="zap" class="w-12 h-12 mx-auto text-primary"></i>
            <h4 class="text-xl font-bold">Are you sure?</h4>
            <p class="text-muted">Send <strong>${alert.recommendedAction}</strong> to <strong>${alert.segment}</strong> immediately?<br/>Auto-Stop Rule: ${alert.autoStopRule}</p>
          </div>
          <div class="mt-8 flex justify-end gap-3">
            <button onclick="closeSheet()" class="py-2 px-4 rounded-xl border-2 border-gray-400 font-semibold hover:bg-gray-100">Cancel</button>
            <button onclick="confirmOneClickSend(${alert.id})" class="py-2 px-4 rounded-xl bg-green-700 text-white font-semibold hover:bg-green-800 flex items-center gap-2"><i data-lucide="send" class="w-5 h-5"></i>Confirm & Send</button>
          </div>`;
        }
      } else if (mode === 'source-selection') {
        const isTemplate = context === 'template';
        const sourceData = isTemplate ? state.templates : state.campaigns.filter(c => c.status !== CAMPAIGN_STATUS.DRAFT);
        title = isTemplate ? "Select Template" : "Reuse Prior Campaign";
        const listItems = sourceData.map(item => `
          <li class="p-3 border-b border-divider hover:bg-gray-50 cursor-pointer" onclick="selectSourceAndClose('${isTemplate ? 'template' : 'reuse'}', ${item.id})" role="link" tabindex="0">
            <div>
              <p class="font-medium as-link">${item.name}</p>
              <p class="text-xs text-muted">${item.subject || item.type}</p>
            </div>
            <i data-lucide="arrow-right" class="w-4 h-4 text-primary"></i>
          </li>`).join('');
        content = `<p class="text-sm text-muted mb-4">Choose a source to pre-fill your new campaign.</p>
          <ul class="border border-divider rounded-lg max-h-96 overflow-y-auto bg-white">${listItems || "<li class='p-3 text-sm text-muted'>No sources found.</li>"}</ul>
          <div class="mt-6 flex justify-end"><button onclick="closeSheet()" class="py-2 px-4 rounded-xl border-2 border-gray-400 font-semibold hover:bg-gray-100">Cancel</button></div>`;
      } else if (mode === 'preview') {
        // Build a live preview based on current compose state + channel
        const isEmail = state.messageType === MESSAGES.EMAIL;
        const isSMS = state.messageType === MESSAGES.SMS;
        const isSocial = state.messageType === MESSAGES.SOCIAL;

        title = `Preview: ${state.compose.name || 'Untitled Campaign'}`;

        const emailPreview = `
          <div class="max-w-[680px] mx-auto border border-gray-200 rounded-xl overflow-hidden shadow-sm">
            <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
              <p class="text-sm text-muted"><strong>From:</strong> hello@provider.com</p>
              <p class="text-sm text-muted"><strong>To:</strong> ${state.compose.audience || '—'}</p>
            </div>
            <div class="px-6 py-5">
              <h3 class="text-xl font-extrabold mb-1">${state.compose.subject || '(no subject)'}</h3>
              <p class="text-sm text-muted mb-4">${state.compose.previewText || 'No preview text'}...</p>
              <div class="prose max-w-none">
                <pre class="text-sm whitespace-pre-wrap leading-relaxed">${state.compose.body || ''}</pre>
              </div>
            </div>
          </div>`;

        const smsPreview = `
          <div class="max-w-sm mx-auto border-2 border-gray-800 rounded-[36px] p-4 bg-white">
            <div class="h-6 w-24 bg-gray-200 rounded-full mx-auto mb-4"></div>
            <div class="space-y-3">
              <div class="bg-gray-100 rounded-2xl p-3 text-sm text-ink">${state.compose.smsText || ''}</div>
            </div>
            <div class="mt-4 text-center text-xs text-muted">SMS preview</div>
          </div>`;

        const socialPreview = `
          <div class="max-w-md mx-auto border border-gray-200 rounded-xl overflow-hidden bg-white">
            <div class="p-3 flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-gray-200"></div>
              <div>
                <p class="text-sm font-extrabold">Your Brand</p>
                <p class="text-xs text-muted">Just now</p>
              </div>
            </div>
            <div class="px-3 pb-3">
              <p class="text-sm text-ink mb-2">${state.compose.socialCaption || ''}</p>
              <img src="${state.compose.mediaUrl}" alt="Post media" class="w-full h-56 object-cover rounded-md border">
            </div>
          </div>`;

        content = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-muted">Channel:</span>
                <span class="text-sm font-extrabold">${state.messageType}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-muted">Audience:</span>
                <span class="text-sm font-extrabold">${state.compose.audience || '—'}</span>
              </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-divider">
              ${isEmail ? emailPreview : isSMS ? smsPreview : socialPreview}
            </div>
            <div class="mt-6 flex justify-end gap-3">
              <button onclick="closeSheet()" class="py-2 px-4 rounded-xl border-2 border-gray-400 font-semibold hover:bg-gray-100">Back to edit</button>
              <button onclick="toast('Test sent to hello@provider.com', 'info')" class="py-2 px-4 rounded-xl btn-primary font-semibold flex items-center gap-2">
                <i data-lucide="mail-check" class="w-5 h-5"></i>Send test
              </button>
            </div>
          </div>`;
      }

      sheet.innerHTML = `<div class="flex justify-between items-center pb-4 border-b border-divider mb-4">
          <h3 class="text-xl font-bold">${title || ''}</h3>
          <button onclick="closeSheet()" class="text-muted hover:text-ink p-1 rounded-full" aria-label="Close dialog"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>${content || ''}`;
      $("global-sheet").classList.remove("hidden");
      $("global-sheet").setAttribute("aria-hidden", "false");
      paintIcons();
    }

    function closeSheet() {
      $("global-sheet").classList.add("hidden");
      $("global-sheet").setAttribute("aria-hidden", "true");
    }

    function selectSourceAndClose(mode, sourceId) {
      const source = (mode === 'template') ? state.templates.find(t => t.id === sourceId) : state.campaigns.find(c => c.id === sourceId);
      if (source) {
        changeComposeMode(mode, source);
        closeSheet();
        toast(`Content loaded from ${source.name}.`, 'info');
      }
    }

    // ---------- Sequence Logic
    function addSequenceStep() { state.sequenceSteps.push({ delay: '3d', condition: 'Non-openers', messageType: state.messageType }); renderDrawer(); }
    function removeSequenceStep(index) { state.sequenceSteps.splice(index, 1); renderDrawer(); }
    function updateSequenceStep(index, field, value) { state.sequenceSteps[index][field] = value; renderDrawer(); }
    function togglePreflightSheet() { state.drawerStep = state.drawerStep === 'schedule' ? 'preflight' : 'schedule'; renderDrawer(); }

    // ---------- Follow-up Logic
    function viewFollowUpDetails(id) { const alert = state.followups.find(a => a.id === id); if (alert) renderSheet('details', alert); }
    function confirmOneClickSend(id) {
      const index = state.followups.findIndex(a => a.id === id);
      if (index !== -1) {
        state.followups[index].status = FOLLOWUP_STATUS.COMPLETED;
        closeSheet();
        toast(`Follow-up sent to ${state.followups[index].segment}!`, 'success');
        render();
      }
    }
    function startManualFollowUp(id) {
      const alert = state.followups.find(a => a.id === id);
      if (!alert) return;
      state.currentCampaign = null;
      state.messageType = MESSAGES.EMAIL;
      state.currentComposeMode = 'scratch';
      Object.assign(state.compose, {
        subject: `Follow-up: ${alert.description}`,
        name: `Follow-up: ${alert.segment}`,
        audience: `${alert.segment} (Locked)`,
        audienceId: `locked-${alert.segment}`,
        body: `[MANUAL FOLLOW-UP] Targeting ${alert.segment}. Auto-stop rule: "${alert.autoStopRule}".`
      });
      state.isCampaignNameSet = true;
      state.isAudienceSet = true;
      state.isReadOnly = false;
      closeSheet();
      changePage('compose');
    }

    // ---------- Overflow menu actions
    function toggleRowMenu(id, ev) { ev?.stopPropagation(); state.openMenuFor = (state.openMenuFor === id) ? null : id; renderList(); }
    function closeRowMenu() { if (state.openMenuFor !== null) { state.openMenuFor = null; renderList(); } }
    function pauseCampaign(id) {
      const i = state.campaigns.findIndex(c => c.id === id);
      if (i === -1) return;
      const c = state.campaigns[i];
      if (c.status === CAMPAIGN_STATUS.ACTIVE || c.status === CAMPAIGN_STATUS.SCHEDULED) {
        c.status = CAMPAIGN_STATUS.PAUSED;
        c.isEditable = true;
        toast(`Campaign '${c.name}' paused.`, 'success');
      } else {
        toast(`Only Active or Scheduled campaigns can be paused.`, 'info');
      }
      closeRowMenu();
    }
    function resumeCampaign(id) {
      const i = state.campaigns.findIndex(c => c.id === id);
      if (i === -1) return;
      const c = state.campaigns[i];
      if (c.status === CAMPAIGN_STATUS.PAUSED) {
        c.status = CAMPAIGN_STATUS.ACTIVE;
        c.isEditable = true;
        toast(`Campaign '${c.name}' resumed.`, 'success');
      } else {
        toast(`Only Paused campaigns can be resumed.`, 'info');
      }
      closeRowMenu();
    }
    function deleteCampaign(id) {
      const c = state.campaigns.find(c => c.id === id);
      if (!c) return;
      if (!confirm(`Delete campaign '${c.name}'? This cannot be undone.`)) return;
      state.campaigns = state.campaigns.filter(c => c.id !== id);
      toast(`Campaign deleted.`, 'success');
      closeRowMenu();
      renderList();
    }
    function duplicateCampaign(id) {
      const c = state.campaigns.find(c => c.id === id);
      if (!c) return;
      const copy = {
        ...c,
        id: Date.now(),
        name: `${c.name} (Copy)`,
        status: CAMPAIGN_STATUS.DRAFT,
        sendTime: '—',
        opens: '-',
        clicks: '-',
        isEditable: true,
        sequences: JSON.parse(JSON.stringify(c.sequences || []))
      };
      state.campaigns.unshift(copy);
      toast(`Duplicated '${c.name}' as draft.`, 'success');
      closeRowMenu();
      renderList();
    }

    // ---------- Final Action
    function handleSubmit() {
      if (state.compose.isSending || !state.isCampaignNameSet || !state.isAudienceSet || state.readOnly) return;
      state.compose.isSending = true;
      renderDrawer();

      setTimeout(() => {
        const newId = Date.now();
        const status = state.scheduleType === 'now' ? CAMPAIGN_STATUS.SENT : CAMPAIGN_STATUS.SCHEDULED;
        const sendTime = state.scheduleType === 'now' ? 'Sent Just Now' : state.scheduleTime || 'Unspecified Time';
        
        const campaignData = {
          id: state.currentCampaign ? state.currentCampaign.id : newId,
          subject: state.compose.subject,
          name: state.compose.name,
          type: state.messageType,
          audience: state.compose.audience,
          status: status,
          sendTime: sendTime,
          opens: status === CAMPAIGN_STATUS.SENT ? 0 : '-',
          clicks: status === CAMPAIGN_STATUS.SENT ? 0 : '-',
          sequences: JSON.parse(JSON.stringify(state.sequenceSteps)),
          isEditable: status !== CAMPAIGN_STATUS.SENT
        };

        if (state.currentCampaign) {
          const index = state.campaigns.findIndex(c => c.id === state.currentCampaign.id);
          if (index !== -1) state.campaigns[index] = campaignData;
        } else {
          state.campaigns.unshift(campaignData);
        }

        closeDrawer();
        state.compose.isSending = false;
        changePage('list');
        toast(`Campaign '${campaignData.name}' ${status === CAMPAIGN_STATUS.SENT ? 'sent' : 'scheduled'}.`, 'success');
      }, 700);
    }

    // ---------- Render helpers
    const chip = (label, color = "gray") => {
      const m = {
        gray: "chip py-0.5 px-2 rounded-full text-xs font-semibold",
        scheduled: "py-0.5 px-2 rounded-full text-xs font-semibold bg-blue-100 text-blue-800",
        draft: "py-0.5 px-2 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800",
        sent: "py-0.5 px-2 rounded-full text-xs font-semibold bg-green-100 text-green-800",
        active: "py-0.5 px-2 rounded-full text-xs font-semibold bg-blue-100 text-blue-800",
        alert: "py-0.5 px-2 rounded-full text-xs font-semibold bg-red-100 text-red-800",
        completed: "py-0.5 px-2 rounded-full text-xs font-semibold bg-green-100 text-green-800",
        paused: "py-0.5 px-2 rounded-full text-xs font-semibold bg-gray-200 text-gray-800"
      }[color] || "chip py-0.5 px-2 rounded-full text-xs font-semibold";
      return `<span class="${m}">${label}</span>`;
    };

    function renderAlerts() {
      const rows = state.followups.map(a => {
        const status = chip(a.status, a.status === FOLLOWUP_STATUS.ALERT ? 'alert' : 'completed');
        const campaignLink = `<button onclick="viewCampaignDetails(${a.campaignId})" class="text-primary as-link font-semibold" role="link">${a.campaignName}</button>`;
        const actionCell = a.status === FOLLOWUP_STATUS.ALERT
          ? `<button onclick="viewFollowUpDetails(${a.id})" class="text-primary as-link font-semibold" role="link">View Details</button>`
          : `<span class="text-muted">Action Taken</span>`;
        return `<tr class="border-b border-divider hover:bg-gray-50">
          <td class="p-4">${status}</td>
          <td class="p-4 font-semibold text-ink">${a.segment}</td>
          <td class="p-4 text-sm text-muted">${a.description}</td>
          <td class="p-4">${campaignLink}</td>
          <td class="p-4 text-sm text-muted">${a.autoStopRule}</td>
          <td class="p-4">${actionCell}</td>
        </tr>`;
      }).join('');

      $("app-container").innerHTML = `
        <div class="space-y-6">
          <div class="bg-surface rounded-xl p-6 border-l-4 border-danger shadow-sm">
            <h2 class="text-xl font-extrabold text-danger flex items-center gap-2 mb-2"><i data-lucide="bell-ring" class="w-5 h-5"></i>Actionable Follow-Up Alerts</h2>
            <p class="text-muted">These segments require attention. Click to review options.</p>
          </div>
          <div class="bg-surface rounded-xl overflow-visible shadow-sm border border-divider">
            <table class="min-w-full"><thead class="bg-gray-50">
              <tr>
                <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Status</th>
                <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Segment</th>
                <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Alert Reason</th>
                <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Source Campaign</th>
                <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Auto-Stop Rule</th>
                <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Actions</th>
              </tr></thead>
              <tbody class="divide-y divide-divider">${rows}</tbody>
            </table>
          </div>
        </div>`;
      paintIcons();
      if ($("top-cta")) $("top-cta").innerHTML = "";
    }

    function renderList() {
      const rows = state.campaigns.map(c => {
        const statusKey = (c.status === CAMPAIGN_STATUS.PAUSED) ? 'paused' : c.status.toLowerCase();
        const status = chip(c.status, statusKey);
        const sequences = c.sequences.map((s, i) => chip(`S${i + 2}: ${s.delay}`, "gray")).join(' ');
        const nameLink = `<button onclick="${c.isEditable ? 'editCampaign' : 'viewCampaignDetails'}(${c.id})" class="font-semibold text-primary as-link text-left" role="link">${c.name}</button>`;
        const subjectText = `<span class="text-ink">${c.subject}</span>`;

        const showPause = (c.status === CAMPAIGN_STATUS.ACTIVE || c.status === CAMPAIGN_STATUS.SCHEDULED);
        const showResume = (c.status === CAMPAIGN_STATUS.PAUSED);

        const overflow = `
          <div class="relative" data-menu-root>
            <button
              class="text-muted hover:text-ink p-1 rounded-full"
              aria-haspopup="menu"
              aria-expanded="${state.openMenuFor === c.id ? 'true' : 'false'}"
              aria-controls="menu-${c.id}"
              data-menu-toggle
              onclick="toggleRowMenu(${c.id}, event)"
              title="More actions"
            >
              <i data-lucide="more-horizontal" class="w-5 h-5"></i>
            </button>
            ${state.openMenuFor === c.id ? `
              <div id="menu-${c.id}" role="menu" class="menu-panel absolute right-0 mt-2">
                ${showPause ? `<button class="menu-item" role="menuitem" onclick="pauseCampaign(${c.id})"><i data-lucide="pause" class="w-4 h-4"></i> Pause</button>` : ``}
                ${showResume ? `<button class="menu-item" role="menuitem" onclick="resumeCampaign(${c.id})"><i data-lucide="play" class="w-4 h-4"></i> Resume</button>` : ``}
                <button class="menu-item" role="menuitem" onclick="duplicateCampaign(${c.id})"><i data-lucide="copy" class="w-4 h-4"></i> Duplicate</button>
                <div class="h-px bg-gray-200 my-1"></div>
                <button class="menu-item text-red-700" role="menuitem" onclick="deleteCampaign(${c.id})"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete</button>
              </div>` : ``}
          </div>`;

        const actionsCell = `
          <div class="flex items-center gap-3">
            ${c.status === CAMPAIGN_STATUS.ACTIVE
              ? `<button onclick="changePage('alerts')" class="text-danger as-link font-semibold text-sm" role="link" title="Open Follow-up Alerts">Follow-up Alert</button>`
              : ``}
            ${overflow}
          </div>`;

        return `<tr class="border-b border-divider hover:bg-gray-50 align-top">
          <td class="p-4">${nameLink}</td>
          <td class="p-4 text-sm">${subjectText}</td>
          <td class="p-4 text-sm text-muted">${c.audience}</td>
          <td class="p-4">${status}</td>
          <td class="p-4 text-sm text-muted">${c.opens} / ${c.clicks}</td>
          <td class="p-4 text-sm text-muted">${c.sendTime}</td>
          <td class="p-4 space-x-2">${sequences || '<span class="text-sm text-muted">—</span>'}</td>
          <td class="p-4">${actionsCell}</td>
        </tr>`;
      }).join('');

      // Top CTA (visible on list only)
      $("top-cta").innerHTML = `
        <button onclick="newCampaign()" class="py-2 px-4 rounded-xl btn-primary font-semibold flex items-center gap-2">
          <i data-lucide="plus" class="w-5 h-5"></i>
          New campaign
        </button>`;

      $("app-container").innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div class="flex gap-2 p-1 bg-surface rounded-xl shadow-sm border border-divider">
              ${['All', 'Scheduled', 'Sent', 'Drafts', 'Active', 'Paused'].map(tab => `
                <button class="py-2 px-4 rounded-lg text-sm font-semibold ${tab === 'All' ? 'bg-gray-200 text-ink border-2 border-gray-800' : 'text-ink hover:bg-gray-100 border-2 border-gray-400'}">${tab}</button>
              `).join('')}
            </div>
          </div>

          <div class="bg-surface rounded-xl overflow-visible shadow-sm border border-divider">
            <table class="min-w-full table-fixed">
              <colgroup>
                <col class="w-[18%]">
                <col class="w-[24%]">
                <col class="w-[16%]">
                <col class="w-[10%]">
                <col class="w-[12%]">
                <col class="w-[12%]">
                <col class="w-[6%]">
                <col class="w-[8%]">
              </colgroup>
              <thead class="bg-gray-50">
                <tr>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Campaign Name</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Subject</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Audience</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Status</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Opens/Clicks</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Send Time</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Sequence</th>
                  <th class="p-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-divider">${rows}</tbody>
            </table>
          </div>
        </div>`;
      paintIcons();
    }

    function renderCompose() {
      const { isEmail, isSMS, isSocial } = {
        isEmail: state.messageType === MESSAGES.EMAIL,
        isSMS: state.messageType === MESSAGES.SMS,
        isSocial: state.messageType === MESSAGES.SOCIAL
      };
      const isAudienceLocked = state.compose.audienceId?.startsWith('locked');
      const isReady = state.isCampaignNameSet && state.isAudienceSet;
      const ro = state.readOnly ? 'disabled' : '';

      const editor = () => {
        if (isEmail) return `
          <div class="p-6 space-y-4">
            <h3 class="text-lg font-extrabold">${state.readOnly ? 'Final Email Content' : 'Email Body Editor'}</h3>
            ${!state.readOnly ? `<div class="flex justify-end">
                <button onclick="toggleUnlayer()" class="py-2 px-3 rounded-xl border-2 border-gray-800 text-sm font-semibold hover:bg-gray-100 flex items-center gap-2" ${isSMS || isSocial ? 'disabled' : ''}>
                  <i data-lucide="${state.compose.isUnlayerOpen ? 'maximize' : 'columns'}" class="w-4 h-4"></i>${state.compose.isUnlayerOpen ? 'Close Editor' : 'Open in Unlayer'}
                </button></div>` : ''}
            <div class="min-h-[300px] border-2 border-gray-800 rounded-xl overflow-hidden">
              ${state.compose.isUnlayerOpen && !state.readOnly
                ? `<div class="p-4 bg-gray-50 h-full grid place-items-center">
                    <div class="text-center text-muted"><i data-lucide="brush" class="w-8 h-8 mx-auto mb-2 text-primary"></i>
                    <p class="font-semibold">Unlayer Editor Placeholder</p></div></div>`
                : `<textarea id="body" oninput="updateCompose('body', this.value)" rows="8" class="w-full p-4 h-full resize-none border-none focus:ring-0" placeholder="Enter content..." ${ro}>${state.compose.body}</textarea>`
              }
            </div>
          </div>`;
        if (isSMS) {
          const count = state.compose.smsText.length;
          return `<div class="p-6 space-y-4">
            <h3 class="text-lg font-extrabold">${state.readOnly ? 'Final SMS Text' : 'SMS Text Editor'}</h3>
            <textarea id="smsText" oninput="updateCompose('smsText', this.value)" rows="5" maxlength="160" class="w-full p-3 border-2 border-gray-800 rounded-xl resize-none focus:border-primary focus:ring-2 focus:ring-blue-200" ${ro}>${state.compose.smsText}</textarea>
            <div class="flex justify-between text-sm"><span class="text-muted flex items-center gap-1"><i data-lucide="link" class="w-4 h-4"></i>Auto link-shortening applied.</span><span class="${count > 140 ? 'text-danger font-bold' : 'text-muted'}">${count}/160</span></div>
          </div>`;
        }
        if (isSocial) return `
          <div class="p-6 grid grid-cols-2 gap-6">
            <div class="space-y-4"><h3 class="text-lg font-extrabold">${state.readOnly ? 'Final Post Caption' : 'Post Caption'}</h3>
              <textarea id="socialCaption" oninput="updateCompose('socialCaption', this.value)" rows="6" class="w-full p-3 border-2 border-gray-800 rounded-xl resize-none focus:border-primary focus:ring-2 focus:ring-blue-200" ${ro}>${state.compose.socialCaption}</textarea></div>
            <div class="space-y-4"><h3 class="text-lg font-extrabold">Media</h3>
              <div class="w-full h-48 bg-gray-100 rounded-xl grid place-items-center border-2 border-dashed border-gray-300 p-4">
                <div class="text-center text-muted"><i data-lucide="image" class="w-6 h-6 mx-auto mb-2"></i><p class="text-sm font-semibold">Media Placeholder</p>${!state.readOnly ? '<button class="text-xs font-semibold text-primary hover:underline mt-1">Upload</button>' : ''}</div>
              </div>
            </div>
          </div>`;
        return '';
      };
      
      $("app-container").innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-start bg-surface rounded-xl p-4 mb-6 shadow-sm border border-divider">
            ${!state.readOnly ? `<div>
                <label class="text-sm font-bold text-muted block mb-2">Compose Mode:</label>
                <div class="flex gap-2">
                  ${['template', 'scratch', 'reuse'].map(mode => `
                    <button onclick="handleModeChange('${mode}')" class="py-2 px-4 rounded-full text-sm font-semibold border-2 ${state.currentComposeMode === mode ? 'bg-yellow-300 text-ink border-yellow-600' : 'bg-gray-100 text-ink border-gray-800 hover:bg-gray-200'}">
                      ${mode[0].toUpperCase() + mode.slice(1)}
                    </button>`).join('')}
                </div>
              </div>` : '<div></div>'}
            <div>
              <label class="text-sm font-bold text-muted block mb-2">Delivery Channel:</label>
              <div class="flex gap-2">
                ${[MESSAGES.EMAIL, MESSAGES.SMS, MESSAGES.SOCIAL].map(type => `
                  <button onclick="changeMessageType('${type}')" class="seg ${state.messageType === type ? 'active' : ''} py-2 px-4 rounded-full text-sm" ${ro}>
                    ${type}
                  </button>`).join('')}
              </div>
            </div>
            <button onclick="changePage('list');" class="text-muted hover:text-ink p-2 rounded-full" aria-label="Close compose"><i data-lucide="x" class="w-6 h-6"></i></button>
          </div>

          <div class="bg-surface rounded-xl p-6 space-y-6 shadow-sm border border-divider">
            <div class="flex flex-wrap items-center gap-3">
              ${chip("From: hello@provider.com")}
              <div class="flex items-center gap-2 px-3 py-2 rounded-xl border-2 border-gray-800 bg-gray-50">
                <span class="text-xs font-extrabold px-2 py-0.5 rounded-full bg-red-100 text-red-800 tracking-wide">REQUIRED</span>
                <span class="text-base font-extrabold flex items-center gap-2 ${isAudienceLocked ? 'text-red-800' : 'text-ink'}">
                  <i data-lucide="users" class="w-4 h-4"></i>
                  Audience: ${state.compose.audience}
                </span>
                ${!isAudienceLocked && !state.readOnly ? `
                  <button onclick="openAudienceDrawer()" class="ml-2 py-1.5 px-3 rounded-lg btn-outline text-sm">
                    Change audience
                  </button>` : isAudienceLocked ? `<i data-lucide="lock" class="w-4 h-4 ml-1"></i>` : ''}
              </div>
              ${!state.isAudienceSet && !state.readOnly ? `<p class="text-xs text-danger font-semibold">Please select an audience.</p>` : ''}
            </div>

            <div class="space-y-4">
              <div>
                <label for="campaignName" class="block text-sm font-bold mb-1">Campaign Name (Internal, Required)</label>
                <input type="text" id="campaignName" oninput="updateCompose('name', this.value)" value="${state.compose.name}" class="w-full p-3 border-2 border-gray-800 rounded-xl focus:border-primary focus:ring-2 focus:ring-blue-200" ${ro} aria-required="true">
                ${!state.isCampaignNameSet && !state.readOnly ? `<p class="text-xs text-danger mt-1 font-semibold">Campaign Name is required.</p>` : ''}
              </div>
              ${(state.messageType !== MESSAGES.SMS) ? `
                <div>
                  <label for="subject" class="block text-sm font-bold mb-1">Subject / Post Title</label>
                  <input type="text" id="subject" oninput="updateCompose('subject', this.value)" value="${state.compose.subject}" class="w-full p-3 border-2 border-gray-800 rounded-xl focus:border-primary focus:ring-2 focus:ring-blue-200" ${ro}>
                </div>` : ''}
              ${state.messageType === MESSAGES.EMAIL ? `
                <div>
                  <label for="previewText" class="block text-sm font-bold mb-1">Preview Text (Optional)</label>
                  <input type="text" id="previewText" oninput="updateCompose('previewText', this.value)" value="${state.compose.previewText}" class="w-full p-3 border-2 border-gray-800 rounded-xl focus:border-primary focus:ring-2 focus:ring-blue-200" ${ro}>
                </div>` : ''}
            </div>
          </div>
          
          <div class="bg-surface rounded-xl p-6 border-l-4 border-primary shadow-sm border border-divider">
            <h2 class="text-xl font-extrabold mb-4 flex items-center text-primary gap-2"><i data-lucide="eye" class="w-5 h-5"></i>Inline Preview (${state.messageType})</h2>
            <div class="bg-gray-50 p-4 rounded-lg border border-divider">
              <p class="font-extrabold text-ink">${state.compose.subject}</p>
              ${state.messageType === MESSAGES.EMAIL ? `<p class="text-sm text-muted mt-1">${state.compose.previewText || 'No preview text'}<span class="text-gray-400">...</span></p>` : ''}
              ${state.messageType === MESSAGES.SMS ? `<p class="text-sm text-ink mt-1">${state.compose.smsText}</p>` : ''}
              ${state.messageType === MESSAGES.SOCIAL ? `<div class="mt-3 flex gap-2"><img src="${state.compose.mediaUrl}" class="w-16 h-16 object-cover rounded-md" alt="Media preview"><p class="text-sm text-ink">${state.compose.socialCaption.substring(0, 100)}...</p></div>` : ''}
            </div>
          </div>

          <div class="bg-surface rounded-xl shadow-sm border border-divider">${editor()}</div>

          <div class="flex justify-between items-center py-4">
            ${!state.readOnly
              ? `<div>
                  <button onclick="renderSheet('preview')" class="py-2 px-4 rounded-xl border-2 border-gray-800 font-semibold hover:bg-gray-100 flex items-center gap-2 text-sm">
                    <i data-lucide="monitor" class="w-4 h-4"></i>Preview &amp; Test
                  </button>
                 </div>
                 <button onclick="openDrawer()" class="py-2 px-4 rounded-xl btn-primary font-semibold flex items-center gap-2" ${isReady ? '' : 'disabled'}><i data-lucide="calendar" class="w-5 h-5"></i>Schedule</button>`
              : `<span class="text-sm font-semibold text-muted flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i>Viewing read-only campaign history.</span>`
            }
          </div>
        </div>`;
      paintIcons();
      if ($("top-cta")) $("top-cta").innerHTML = ""; // no New Campaign on Compose
    }

    // ---------- Main Render
    function render() {
      if ($("global-sheet").classList.contains("hidden")) {
        $("global-sheet").querySelector("div:last-child").innerHTML = "";
      }
      if (state.page === "list") renderList();
      else if (state.page === "compose") renderCompose();
      else if (state.page === "alerts") renderAlerts();
    }

    // ---------- Init
    document.addEventListener("DOMContentLoaded", () => {
      render();
      paintIcons();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (state.drawerOpen) closeDrawer();
          else if (!$("global-sheet").classList.contains("hidden")) closeSheet();
          else closeRowMenu();
        }
      });
    });
  </script>
</body>
</html>

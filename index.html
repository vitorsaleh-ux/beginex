<head>

    <style>
        /* Define Monday.com inspired colors and structure */
        :root {
            --color-primary: #0085FF;
            --color-primary-hover: #0B74DA;
            --color-success: #00C875;
            --color-warning: #FFCB00;
            --color-danger: #FF3D57;

            --color-bg: #F7F9FC;
            --color-surface: #FFFFFF;

            --spacing-unit: 8px;

            --flow-start: #00C875; /* Green Circle */

            --flow-action: #0085FF; /* Blue Rect */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-strong);
        }

        /* Custom Tailwind Configuration */
        .primary-btn {
            background-color: var(--color-primary);
            color: white;
            padding: var(--spacing-unit) calc(var(--spacing-unit) * 2);
            border-radius: var(--radius-xl);
            font-weight: 600;
            transition: background-color 150ms;
        }
        .primary-btn:hover {
            background-color: var(--color-primary-hover);
        }
        .primary-btn:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }
        .primary-btn:disabled {
            background-color: var(--color-divider);
            color: var(--color-text-muted);
            cursor: not-allowed;
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--color-text-strong);
            padding: var(--spacing-unit) calc(var(--spacing-unit) * 2);
            border-radius: var(--radius-xl);
            font-weight: 500;
            border: 1px solid var(--color-divider);
            transition: background-color 150ms;
        }
        .secondary-btn:hover {
            background-color: #F0F4F9;
        }
        .secondary-btn:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .input-style {
            padding: var(--spacing-unit);
            border: 1px solid var(--color-divider);
            border-radius: var(--radius-xl);
            background-color: var(--color-surface);
            transition: border-color 150ms;
        }
        .input-style:focus {
            border-color: var(--color-primary);
            outline: none;
            box-shadow: 0 0 0 3px #9FD0FF; /* Focus ring */
        }
        .input-style[disabled] {
            background-color: #F0F4F9;
            color: var(--color-text-muted);
        }

        .card {
            background-color: var(--color-surface);
            border-radius: var(--radius-xl);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03); /* Subtle shadow */
        }
        
        /* Chips styling */
        .chip-base { padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .chip-scheduled { background-color: #EAF4FF; color: var(--color-primary); }
        .chip-draft { background-color: #FFF6D9; color: #FFCB00; }
        .chip-sent { background-color: #E6FBF1; color: var(--color-success); }
        .chip-danger { background-color: #FFE6E9; color: var(--color-danger); }
        .chip-sequence { background-color: var(--color-divider); color: var(--color-text-strong); }
        .chip-alert { background-color: #FFE6E9; color: var(--color-danger); }
        .chip-alert-active { background-color: #EAF4FF; color: var(--color-primary); }
        .chip-alert-completed { background-color: #E6FBF1; color: var(--color-success); }

        /* Drawer Transition */
        .drawer-container {
            transition: transform 300ms ease-in-out;
            transform: translateX(100%);
            z-index: 50;
        }
        .drawer-container.open {
            transform: translateX(0);
        }

        /* Sheet/Modal inside drawer and main app container */
        .sheet-overlay {
            background-color: rgba(247, 249, 252, 0.8); /* BG color with opacity */
            backdrop-filter: blur(2px);
            z-index: 60;
            transition: opacity 200ms ease;
        }
        .sheet-container {
            position: fixed; /* For modal behavior over main content */
            inset: 0;
            z-index: 70;
            background-color: rgba(0,0,0,0.1);
            backdrop-filter: blur(2px);
            display: none;
        }
        .sheet-content {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
    </style>
    
    <!-- Firebase SDK Imports (Mandatory boilerplate) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setDoc, doc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables must be used as provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);

            async function authenticate() {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    console.log("Firebase authenticated successfully.");

                    // Example usage of global userId and appId (Private data path)
                    const userId = auth.currentUser?.uid || 'anonymous';
                    const privateDocRef = doc(db, `/artifacts/${appId}/users/${userId}/config/metadata`);
                    await setDoc(privateDocRef, { initialized: new Date().toISOString() }, { merge: true });

                } catch (error) {
                    console.error("Firebase authentication failed:", error);
                }
            }

            authenticate();
        } else {
            console.warn("Firebase config not available. Running in local demo mode.");
        }
    </script>

<script>
// --- Core Application State & Constants ---
const MESSAGES = {
    EMAIL: 'Email',
    SMS: 'SMS',
    SOCIAL: 'Social Post'
};

const CAMPAIGN_STATUS = {
    SENT: 'Sent',
    SCHEDULED: 'Scheduled',
    DRAFT: 'Drafts',
    PAUSED: 'Paused',
    ACTIVE: 'Active'
};

const FOLLOWUP_STATUS = {
    ALERT: 'Alert',
    COMPLETED: 'Completed',
    SKIPPED: 'Skipped'
};

let state = {
    currentPage: 'list', // 'list', 'compose', 'followup-list', or 'campaign-detail' (read-only compose)
    currentComposeMode: 'scratch', // 'template', 'scratch', or 'reuse'
    isDrawerOpen: false,
    drawerStep: 'schedule', // 'schedule' or 'preflight'
    currentCampaign: null, // The campaign object being edited/viewed
    messageType: MESSAGES.EMAIL,
    scheduleType: 'now', // 'now' or 'later'
    scheduleTime: '',
    sequenceSteps: [],
    isReadOnly: false, // New state for Campaign Detail view
    // Required for scheduling
    isCampaignNameSet: true, 
    isAudienceSet: true,

    campaigns: [
        {
            id: 1,
            subject: "Your Weekly Class Update: New Features Inside",
            name: "Weekly Update 10/25",
            type: MESSAGES.EMAIL,
            audience: "Parents (1,742)",
            status: CAMPAIGN_STATUS.SENT,
            sendTime: "Oct 25, 10:00 AM",
            opens: 54,
            clicks: 12,
            sequences: [],
            isEditable: false
        },
        {
            id: 2,
            subject: "Don't Miss Out! Registration Closes Tomorrow",
            name: "Registration Reminder P1",
            type: MESSAGES.EMAIL,
            audience: "Parents (1,742)",
            status: CAMPAIGN_STATUS.SCHEDULED,
            sendTime: "Nov 10, 3:00 PM",
            opens: '-',
            clicks: '-',
            sequences: [
                { delay: '3d', condition: 'Non-openers', messageType: MESSAGES.SMS },
                { delay: '7d', condition: 'Everyone', messageType: MESSAGES.EMAIL }
            ],
            isEditable: true
        },
        {
            id: 3,
            subject: "Summer Camp Early Bird Discount",
            name: "Summer Camp P1",
            type: MESSAGES.EMAIL,
            audience: "Leads (3,200)",
            status: CAMPAIGN_STATUS.ACTIVE,
            sendTime: "Sent 2 days ago",
            opens: 600,
            clicks: 80,
            sequences: [],
            isEditable: true
        }
    ],
    templates: [
        { id: 201, name: "Seasonal Promo (Email)", type: MESSAGES.EMAIL, subject: "BIG Savings Inside!", body: "Use this template for major promotions. It includes a high-contrast CTA button ready for personalization." },
        { id: 202, name: "Enrollment Reminder (SMS)", type: MESSAGES.SMS, smsText: "Last chance to enroll! Don't miss out. [Link]" }
    ],
    followupAlerts: [
        {
            id: 101,
            campaignId: 3,
            campaignName: "Summer Camp P1",
            segment: "Non-Clickers (1,120)",
            description: "High-value prospects haven't clicked the camp link.",
            recommendedAction: "SMS follow-up using Template X",
            autoStopRule: "Reply to any message",
            status: FOLLOWUP_STATUS.ALERT
        },
        {
            id: 102,
            campaignId: 2,
            campaignName: "Registration Reminder P1",
            segment: "Non-Openers (380)",
            description: "Segment hasn't opened the final registration reminder.",
            recommendedAction: "Send Email with new subject line.",
            autoStopRule: "Class-full status",
            status: FOLLOWUP_STATUS.ALERT
        },
        {
            id: 103,
            campaignId: 1,
            campaignName: "Weekly Update 10/25",
            segment: "Low-Engagement (52)",
            description: "Completed last week with low open rate in this segment.",
            recommendedAction: "Send an SMS survey.",
            autoStopRule: "Payment received",
            status: FOLLOWUP_STATUS.COMPLETED
        }
    ],

    // Variables for the composing campaign (used for new or existing edits)
    compose: {
        subject: "New Campaign Draft",
        name: "New Campaign Draft", // Campaign name is now required
        audience: "None Selected",
        audienceId: null,
        previewText: "",
        body: "Start with a clean slate for your rich HTML content.",
        smsText: "Start typing your SMS here. [Link]",
        socialCaption: "Write a new social post caption.",
        mediaUrl: "https://placehold.co/400x200/4c7ff5/ffffff?text=Media+Placeholder",
        isUnlayerOpen: false,
        isSending: false
    }
};

// --- DOM Elements ---
const appContainer = document.getElementById('app-container');
const drawerContainer = document.getElementById('schedule-drawer');
const drawerOverlay = document.getElementById('drawer-overlay');
const toastContainer = document.getElementById('toast-container');
const mainHeader = document.getElementById('main-header');
const globalSheetContainer = document.getElementById('global-sheet-container');

// --- Utility Functions ---

/** Renders Lucide icons */
function renderIcons() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
}

/** Shows a temporary toast notification */
function showToast(message, type = 'success', duration = 4000) {
    const colorClass = {
        success: 'bg-green-100 text-green-700 border-green-300',
        danger: 'bg-red-100 text-red-700 border-red-300',
        info: 'bg-blue-100 text-blue-700 border-blue-300'
    }[type];

    const icon = {
        success: 'check-circle',
        danger: 'alert-triangle',
        info: 'info'
    }[type];

    const toast = document.createElement('div');
    toast.className = `p-4 mb-2 rounded-xl border-l-4 shadow-md ${colorClass} transition-all duration-300 opacity-0 transform translate-y-2`;
    toast.innerHTML = `<div class="flex items-center"><i data-lucide="${icon}" class="w-5 h-5 mr-3"></i><span>${message}</span></div>`;

    toastContainer.appendChild(toast);
    renderIcons();

    // Animate in
    setTimeout(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
    }, 50);

    // Animate out and remove
    setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

// --- Page Navigation and State Mutators ---

function changePage(page, options = {}) {
    state.currentPage = page;
    state.isDrawerOpen = false; // Always close drawer on page change
    state.isReadOnly = options.readOnly || false;
    closeDrawer();
    closeGlobalSheet(); // Close any open sheet
    render();

    if (page === 'alert-list') {
        mainHeader.textContent = "Follow-up Alerts";
    } else if (page === 'campaign-detail') {
        mainHeader.textContent = `Campaign Detail: ${state.currentCampaign?.name || 'Loading...'}`;
    } else {
        mainHeader.textContent = "BeAKampaign";
    }
}

function newCampaign() {
    state.currentCampaign = null;
    state.messageType = MESSAGES.EMAIL;
    state.currentComposeMode = 'scratch';
    state.isCampaignNameSet = false; // Reset required fields
    state.isAudienceSet = false;
    // Default compose state
    state.compose.subject = "New Campaign Draft";
    state.compose.name = "New Campaign Draft";
    state.compose.audience = "None Selected";
    state.compose.audienceId = null;
    state.compose.previewText = "";
    state.compose.body = "Start with a clean slate for your rich HTML content.";
    state.compose.smsText = "Start typing your SMS here. [Link]";
    state.compose.socialCaption = "Write a new social post caption.";
    state.compose.isUnlayerOpen = false;
    state.sequenceSteps = [];
    changePage('compose');
}

function viewCampaignDetails(campaignId) {
    const campaign = state.campaigns.find(c => c.id === campaignId);
    if (!campaign) return showToast("Campaign not found.", 'danger');

    state.currentCampaign = campaign;
    state.messageType = campaign.type;
    state.currentComposeMode = 'reuse'; 
    state.compose.subject = campaign.subject;
    state.compose.name = campaign.name;
    state.compose.audience = campaign.audience;
    state.isCampaignNameSet = true;
    state.isAudienceSet = true;
    state.compose.previewText = campaign.previewText || '';
    state.compose.body = "This is the final sent content (read-only view)."; // Mock read-only content
    state.compose.isUnlayerOpen = false;
    state.sequenceSteps = JSON.parse(JSON.stringify(campaign.sequences)); 
    // Set page to read-only detail view
    changePage('compose', { readOnly: true }); 
}

function editCampaign(campaignId) {
    const campaign = state.campaigns.find(c => c.id === campaignId);
    if (!campaign || !campaign.isEditable) return showToast("This campaign is read-only (Sent).", 'info');

    state.currentCampaign = campaign;
    state.messageType = campaign.type;
    state.currentComposeMode = 'reuse'; 
    state.isReadOnly = false; // Ensure it's editable
    state.compose.subject = campaign.subject;
    state.compose.name = campaign.name;
    state.compose.audience = campaign.audience;
    state.isCampaignNameSet = true;
    state.isAudienceSet = true;

    state.compose.previewText = campaign.previewText || '';
    state.compose.body = "Restoring content from prior campaign..."; // Mock retrieval
    state.compose.isUnlayerOpen = false;
    state.sequenceSteps = JSON.parse(JSON.stringify(campaign.sequences)); 

    changePage('compose', { readOnly: false });
}

function updateCompose(field, value) {
    if (state.isReadOnly) return;
    state.compose[field] = value;

    if (field === 'subject' && state.compose.name === "New Campaign Draft") {
        state.compose.name = value;
    }
    
    // Check if required fields are set (mocked)
    state.isCampaignNameSet = state.compose.name.trim().length > 0;
    if (field === 'name') state.isCampaignNameSet = value.trim().length > 0;
    
    renderCompose();
}

function handleModeChange(mode) {
    if (mode === 'scratch') {
        changeComposeMode('scratch');
    } else {
        renderGlobalSheet('source-selection', mode);
    }
}

function changeComposeMode(mode, selectedSource = null) {
    state.currentComposeMode = mode;
    state.messageType = MESSAGES.EMAIL; // Reset to default when changing mode
    state.compose.isUnlayerOpen = false;

    if (mode === 'template' && selectedSource) {
        state.compose.subject = selectedSource.subject;
        state.compose.body = selectedSource.body;
        state.messageType = selectedSource.type;

    } else if (mode === 'reuse' && selectedSource) {
        state.compose.subject = `Reusing: ${selectedSource.name}`;
        state.compose.body = `Content loaded from campaign: ${selectedSource.name}.`;
        state.messageType = selectedSource.type;
    } else if (mode === 'scratch') {
        state.compose.subject = "New Campaign Draft";
        state.compose.body = "Start with a clean slate for your rich HTML content.";
    }
    renderCompose();
}

function mockSetAudience(segment) {
    if (state.isReadOnly) return;
    state.compose.audience = segment;
    state.compose.audienceId = 'mock-id-123'; // Mock ID
    state.isAudienceSet = true;
    showToast(`Audience set to: ${segment}`, 'info');
    renderCompose();
}

function changeMessageType(newType) {
    if (state.isReadOnly) return;
    state.messageType = newType;
    state.compose.isUnlayerOpen = false; // Close Unlayer if editor changes
    renderCompose();
}

function toggleUnlayer() {
    if (state.isReadOnly) return;
    state.compose.isUnlayerOpen = !state.compose.isUnlayerOpen;
    renderCompose();
}

// --- Drawer Logic ---

function openDrawer() {
    if (state.isReadOnly) return showToast("Cannot schedule, viewing in read-only mode.", 'info');

    const isReady = state.isCampaignNameSet && state.isAudienceSet;
    if (!isReady) {
        showToast("Campaign Name and Audience are required before scheduling.", 'danger');
        return;
    }

    state.isDrawerOpen = true;
    state.drawerStep = 'schedule';
    drawerContainer.classList.add('open');
    drawerOverlay.classList.remove('hidden');
    setTimeout(() => drawerOverlay.classList.remove('opacity-0'), 10); // Animate overlay
    renderDrawer();

    // Focus trap (Basic)
    const focusableElements = drawerContainer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusableElements.length > 0) {
        focusableElements[0].focus();
    }
}

function closeDrawer() {
    state.isDrawerOpen = false;
    drawerContainer.classList.remove('open');
    drawerOverlay.classList.add('opacity-0');
    setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
    render();
}

// --- Global Sheet Logic (Template/Reuse Selection, One-Click Confirm) ---

function renderGlobalSheet(mode, context) {
    let content;
    let title;
    const sheet = globalSheetContainer;

    if (mode === 'details' || mode === 'confirm') {
        // FOLLOW-UP ALERT SHEETS (reusing previous logic)
        const alert = state.followupAlerts.find(a => a.id === (mode === 'details' ? context.id : context));
        if (!alert) return;

        if (mode === 'details') {
            title = `Follow-up Details: ${alert.campaignName}`;
            content = `<div class="space-y-4">
<div class="p-3 bg-gray-50 rounded-xl"><h4 class="text-sm font-semibold text-gray-700">Segment</h4><p class="font-medium text-lg text-danger">${alert.segment}</p><p class="text-xs text-gray-500">${alert.description}</p></div>
<div class="p-3 bg-blue-50 rounded-xl"><h4 class="text-sm font-semibold text-gray-700">Recommended Action</h4><p class="font-medium text-lg text-primary">${alert.recommendedAction}</p></div>
<div class="p-3 bg-yellow-50 rounded-xl"><h4 class="text-sm font-semibold text-gray-700">Auto-Stop Rule</h4><p class="text-sm text-yellow-700">${alert.autoStopRule}</p></div>
</div>
<div class="mt-8 flex justify-between space-x-4">
<button onclick="renderGlobalSheet('confirm', ${alert.id})" class="primary-btn flex-1 flex items-center justify-center"><i data-lucide="check-circle" class="w-5 h-5 mr-2"></i>One-Click Send</button>
<button onclick="startManualFollowUp(${alert.id})" class="secondary-btn flex-1 flex items-center justify-center"><i data-lucide="edit" class="w-5 h-5 mr-2"></i>Manual Compose</button>
</div>`;
        } else if (mode === 'confirm') {
            title = `Confirm One-Click Follow-Up`;
            content = `<div class="space-y-6 text-center">
<i data-lucide="zap" class="w-12 h-12 mx-auto text-primary"></i>
<h4 class="text-xl font-bold">Are you sure you want to send this follow-up?</h4>
<p class="text-gray-600">You are sending the **recommended template** to the **${alert.segment}** segment immediately.<br>*Auto-Stop Rule: ${alert.autoStopRule}*</p>
</div>
<div class="mt-8 flex justify-end space-x-3">
<button onclick="closeGlobalSheet()" class="secondary-btn">Cancel</button>
<button onclick="confirmOneClickSend(${alert.id})" class="primary-btn bg-success hover:bg-green-700"><i data-lucide="send" class="w-5 h-5 mr-2"></i>Confirm & Send Now</button>
</div>`;
        }

    } else if (mode === 'source-selection') {
        // TEMPLATE/REUSE SELECTION SHEET

function closeGlobalSheet() {
    globalSheetContainer.style.display = 'none';
    render(); // Rerender to clear any temporary state effects
}

function selectSourceAndClose(mode, sourceId) {
    let source = null;
    if (mode === 'template') {
        source = state.templates.find(t => t.id === sourceId);
    } else if (mode === 'reuse') {
        source = state.campaigns.find(c => c.id === sourceId);
    }

    if (source) {
        changeComposeMode(mode, source);
        closeGlobalSheet();
        showToast(`Content loaded from ${source.name}.`, 'info');
    }
}
// --- Sequence Logic (inside Drawer) --- (No changes here, kept for completeness)

function addSequenceStep() {
    const newStep = {
        delay: '3d', // 3 days default
        condition: 'Non-openers', // Default
        messageType: state.messageType // Inherit from Compose
    };
    state.sequenceSteps.push(newStep);
    renderDrawer();
}

function removeSequenceStep(index) {
    state.sequenceSteps.splice(index, 1);
    renderDrawer();
}

function updateSequenceStep(index, field, value) {
    state.sequenceSteps[index][field] = value;
    renderDrawer();
}

function togglePreflightSheet() {
    state.drawerStep = state.drawerStep === 'schedule' ? 'preflight' : 'schedule';
    renderDrawer();
}

// --- Follow-up Logic ---
function viewFollowUpDetails(alertId) {
    const alert = state.followupAlerts.find(a => a.id === alertId);
    if (!alert) return;

    renderGlobalSheet('details', alert);
}

function confirmOneClickSend(alertId) {
    const alertIndex = state.followupAlerts.findIndex(a => a.id === alertId);
    if (alertIndex !== -1) {
        state.followupAlerts[alertIndex].status = FOLLOWUP_STATUS.COMPLETED;
        closeGlobalSheet();
        showToast(`Follow-up sent successfully to ${state.followupAlerts[alertIndex].segment}!`, 'success');
    }
}

function startManualFollowUp(alertId) {
    const alert = state.followupAlerts.find(a => a.id === alertId);
    if (!alert) return;

    state.currentCampaign = null;
    state.messageType = MESSAGES.EMAIL; // Default to email for manual
    state.currentComposeMode = 'scratch';
    // Prefill and lock audience
    state.compose.subject = `Follow-up: ${alert.description}`;
    state.compose.name = `Follow-up: ${alert.segment}`;
    state.compose.audience = alert.segment + " (Locked)";
    state.compose.audienceId = 'locked-' + alert.segment;
    state.isCampaignNameSet = true;
    state.isAudienceSet = true; // Locked
    state.isReadOnly = false; // Ensure it's editable
    // Contextual body
    state.compose.body = `[MANUAL FOLLOW-UP] We are targeting the segment that has been identified as ${alert.segment}. This message will automatically stop if the condition: "${alert.autoStopRule}" is met.`;

    closeGlobalSheet();
    changePage('compose'); // Opens the compose view
}

// --- Final Action ---

function handleSubmit() {
    if (!state.isCampaignNameSet || !state.isAudienceSet || state.isReadOnly) {
        return; // Should be disabled, but safeguard
    }

    // Mock sending process
    state.compose.isSending = true;
    renderDrawer();

    setTimeout(() => {
        // Update the state with the new campaign (mock persistence)
        const newId = state.campaigns.length + 1;
        const status = state.scheduleType === 'now' ? CAMPAIGN_STATUS.SENT : CAMPAIGN_STATUS.SCHEDULED;
        const sendTime = state.scheduleType === 'now' ? 'Sent Just Now' : state.scheduleTime || 'Unspecified Time';

        const newCampaignData = {
            id: state.currentCampaign ? state.currentCampaign.id : newId,
            subject: state.compose.subject,
            name: state.compose.name,
            type: state.messageType,
            audience: state.compose.audience,
            status: status,
            sendTime: sendTime,
            opens: status === CAMPAIGN_STATUS.SENT ? 0 : '-',
            clicks: status === CAMPAIGN_STATUS.SENT ? 0 : '-',
            sequences: JSON.parse(JSON.stringify(state.sequenceSteps)),
            isEditable: status !== CAMPAIGN_STATUS.SENT
        };

        if (state.currentCampaign && state.currentCampaign.id < 100) {
            // Update existing core campaign
            const index = state.campaigns.findIndex(c => c.id === state.currentCampaign.id);
            state.campaigns[index] = newCampaignData;
        } else {
            // Add new campaign
            state.campaigns.push(newCampaignData);
        }

        closeDrawer();
        state.compose.isSending = false;
        state.currentPage = 'list';
        render();

        const action = status === CAMPAIGN_STATUS.SENT ? 'sent' : 'scheduled';
        showToast(`Campaign '${newCampaignData.name}' successfully ${action}.`, 'success', 10000); // 10s undo snackbar simulation
    }, 1000); // Simulate API call delay
}

function renderDrawer() {
    if (!state.isDrawerOpen) {
        drawerContainer.innerHTML = '';
        return;
    }

    const isPreflight = state.drawerStep === 'preflight';

    const sequenceList = state.sequenceSteps.map((step, index) => {
        const stepNumber = index + 2;
        return `<div class="p-4 bg-gray-50 rounded-xl border border-divider flex items-center space-x-3 mb-2">
<span class="font-bold text-lg text-primary">S${stepNumber}</span>
<div class="flex-1 grid grid-cols-3 gap-3">
<!-- Delay -->
<select onchange="updateSequenceStep(${index}, 'delay', this.value)" class="input-style text-sm">
<option value="3d" ${step.delay === '3d' ? 'selected' : ''}>Delay: 3 days</option>
<option value="1d" ${step.delay === '1d' ? 'selected' : ''}>Delay: 1 day</option>
<option value="5h" ${step.delay === '5h' ? 'selected' : ''}>Delay: 5 hours</option>
</select>
<!-- Condition -->
<select onchange="updateSequenceStep(${index}, 'condition', this.value)" class="input-style text-sm">
<option value="Non-openers" ${step.condition === 'Non-openers' ? 'selected' : ''}>Condition: Non-openers</option>
<option value="Non-clickers" ${step.condition === 'Non-clickers' ? 'selected' : ''}>Condition: Non-clickers</option>
<option value="Everyone" ${step.condition === 'Everyone' ? 'selected' : ''}>Condition: Everyone</option>
</select>
<!-- Message Type -->
<select onchange="updateSequenceStep(${index}, 'messageType', this.value)" class="input-style text-sm">
${[MESSAGES.EMAIL, MESSAGES.SMS, MESSAGES.SOCIAL].map(type => 
    `<option value="${type}" ${step.messageType === type ? 'selected' : ''}>Type: ${type}</option>`
).join('')}
</select>
</div>
<button onclick="removeSequenceStep(${index})" class="text-gray-400 hover:text-danger p-1 rounded-full transition-colors" title="Remove step">
<i data-lucide="x" class="w-5 h-5"></i>
</button>
</div>`;
    }).join('');

    const drawerHtml = `
<!-- Header -->
<div class="p-6 border-b border-divider flex justify-between items-center">
<h2 class="text-xl font-bold">Schedule Campaign</h2>
<button onclick="closeDrawer()" class="text-gray-500 hover:text-gray-800 p-2 rounded-full hover:bg-gray-100 transition-colors" title="Close Drawer" aria-label="Close Schedule Drawer">
<i data-lucide="x" class="w-6 h-6"></i>
</button>
</div>

<!-- Body (Scrollable) -->
<div class="flex-1 overflow-y-auto p-6 space-y-8">
<!-- Recipients (Read-only) -->
<div>
<h3 class="font-bold text-gray-700 mb-2">Recipients</h3>
<div class="p-3 bg-gray-50/50 rounded-lg text-sm text-gray-600 flex items-center">
<i data-lucide="users" class="w-4 h-4 mr-2"></i>Audience: ${state.compose.audience}
${state.compose.audience.includes('Locked') ? `<span class="text-danger ml-2 font-medium">(Locked for Follow-up)</span>` : ''}
</div>
</div>

<!-- When: Send now / Schedule later -->
<div>
<h3 class="font-bold text-gray-700 mb-3">When to Send?</h3>
<div class="flex space-x-4 mb-4">
<button onclick="state.scheduleType='now'; renderDrawer();" class="flex-1 py-3 border rounded-xl text-center font-medium transition-all ${state.scheduleType === 'now' ? 'bg-primary text-white border-primary' : 'bg-white text-gray-700 border-divider hover:bg-gray-50'}">Send now</button>
<button onclick="state.scheduleType='later'; renderDrawer();" class="flex-1 py-3 border rounded-xl text-center font-medium transition-all ${state.scheduleType === 'later' ? 'bg-primary text-white border-primary' : 'bg-white text-gray-700 border-divider hover:bg-gray-50'}">Schedule later</button>
</div>

${state.scheduleType === 'later' ? `
<div class="space-y-3 p-3 bg-gray-50/50 rounded-lg">
<label class="block text-sm font-medium">Date & Time</label>
<input type="datetime-local" onchange="state.scheduleTime=this.value; renderDrawer();" class="input-style w-full">
<span class="block text-xs text-gray-500">Current Timezone: America/New_York (GMT-5)</span>
<button onclick="showToast('AI time recommendation applied: Nov 10, 3:00 PM', 'info')" class="text-sm font-medium text-primary hover:underline flex items-center">
<i data-lucide="zap" class="w-4 h-4 mr-1"></i>AI recommend time
</button>
</div>` : ''}
</div>

<!-- 4.0 Sequences: Add follow-ups -->
<div>
<h3 class="font-bold text-gray-700 mb-3">Add Follow-ups (Sequences)</h3>
<div id="sequence-list" class="space-y-3">
${state.sequenceSteps.length > 0 ? sequenceList : '<p class="text-sm text-gray-500 p-2">No follow-up steps added yet.</p>'}
</div>
<button onclick="addSequenceStep()" class="secondary-btn w-full mt-3 flex items-center justify-center">
<i data-lucide="plus" class="w-5 h-5 mr-2"></i>+ Add step
</button>
</div>

<!-- Pre-flight Check Button -->
<div class="pt-4 border-t border-divider">
<button onclick="togglePreflightSheet()" class="secondary-btn w-full flex items-center justify-center">
<i data-lucide="shield-check" class="w-5 h-5 mr-2"></i>Run Pre-flight check
</button>
</div>
</div>

<!-- Footer -->
<div class="p-6 border-t border-divider flex justify-end space-x-3">
<button onclick="closeDrawer()" class="secondary-btn">Cancel</button>
<button onclick="handleSubmit()" class="primary-btn flex items-center ${state.compose.isSending ? 'opacity-70 cursor-not-allowed' : ''}" ${state.compose.isSending ? 'disabled' : ''}>
${state.compose.isSending ?
`<i data-lucide="loader-circle" class="w-5 h-5 mr-2 animate-spin"></i> Processing...` :
`<i data-lucide="send" class="w-5 h-5 mr-2"></i> ${state.scheduleType === 'now' ? 'Send now' : 'Schedule send'}`
}
</button>
</div>

<!-- 4.0 Pre-flight Check Sheet (Nested inside Drawer) -->
<div id="preflight-sheet" class="sheet-overlay absolute inset-0 transition-opacity ${isPreflight ? 'opacity-100 visible' : 'opacity-0 invisible'}">
<div class="absolute inset-0 p-6 flex flex-col bg-white">
<div class="flex justify-between items-center pb-4 border-b border-divider">
<h3 class="text-xl font-bold flex items-center"><i data-lucide="shield-check" class="w-6 h-6 mr-2 text-primary"></i>Campaign Pre-flight Check</h3>
<button onclick="togglePreflightSheet()" class="text-gray-500 hover:text-gray-800 p-1 rounded-full transition-colors" title="Close Sheet" aria-label="Close Pre-flight Check Sheet">
<i data-lucide="x" class="w-6 h-6"></i>
</button>
</div>
<div class="py-4 space-y-3 flex-1 overflow-y-auto">
<div class="p-3 bg-green-50 rounded-lg border border-green-300 text-sm">
<span class="font-semibold">PASSED:</span> Subject Line Check (1/1)
<p class="text-xs text-green-700">The subject line is not marked as spam.</p>
</div>
<div class="p-3 bg-yellow-50 rounded-lg border border-yellow-300 text-sm">
<span class="font-semibold">WARNING:</span> Link Verification (2/3)
<p class="text-xs text-yellow-700">One link redirects to an unsecure HTTP URL. Review for optimal deliverability.</p>
</div>
<div class="p-3 bg-green-50 rounded-lg border border-green-300 text-sm">
<span class="font-semibold">PASSED:</span> Audience Size Check
<p class="text-xs text-green-700">${state.compose.audience} recipients are currently active and valid.</p>
</div>
<div class="p-3 bg-green-50 rounded-lg border border-green-300 text-sm">
<span class="font-semibold">PASSED:</span> Sequence Logic
<p class="text-xs text-green-700">Follow-up steps (${state.sequenceSteps.length} added) are logically sound.</p>
</div>
<p class="text-sm text-gray-500 mt-4">All critical checks passed. You are ready to schedule/send.</p>
</div>
<button onclick="togglePreflightSheet()" class="primary-btn w-full mt-4">Return to Schedule</button>
</div>
</div>
`;
    drawerContainer.innerHTML = drawerHtml;
    renderIcons();
}

// --- Event Listeners and Initial Load ---
document.addEventListener('DOMContentLoaded', () => {
    render();

    // Accessibility: Close drawer/sheet on ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.isDrawerOpen) {
            closeDrawer();
        } else if (e.key === 'Escape' && document.getElementById('global-sheet-container').style.display !== 'none') {
            closeGlobalSheet();
        }
    });

    // Accessibility: Cmd/Ctrl+Enter submits in drawer (simulated)
    drawerContainer.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' && (e.metaKey || e.ctrlKey)) && state.drawerStep === 'schedule') {
            e.preventDefault();
            const submitBtn = document.querySelector('#schedule-drawer .primary-btn:not([disabled])');
            if (submitBtn) submitBtn.click();
        }
    });
});

function render() {
    // Ensure the sheet is hidden before main rendering
    // NOTE: We only check if it should be shown if triggered by a function call.
    if (globalSheetContainer.style.display === 'none') {
        globalSheetContainer.innerHTML = '';
    }
    
    if (state.currentPage === 'list') {
        renderList();
    } else if (state.currentPage === 'compose' || state.currentPage === 'campaign-detail') {
        renderCompose();
    } else if (state.currentPage === 'alert-list') {
        renderAlertList();
    }

    // Ensure drawer visibility is synced with state
    if (state.isDrawerOpen) {
        renderDrawer();
    } else {
        drawerContainer.classList.remove('open');
        drawerOverlay.classList.add('hidden', 'opacity-0');
    }
}
</script>
</body>
</html>
